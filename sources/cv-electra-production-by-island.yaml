traps:
  - summary: The 2024 report covers only the first half of the year, and its production table is an image.
    detail: >-
      The Electra SA 2024 report says 2024 data cover six months of activity; its "Produção por
      Ilha" table is embedded as a picture with no extractable text. No full-year 2024 island
      split was found.
    evidence: https://www.electra.cv/backend/web/uploads/RELAT%C3%93RIOECONTAS2024ELECTRA,SA.pdf
    found: 2026-11-06
  - summary: Wind is split by island and power station, not by wind farm owner.
    detail: >-
      Island rows mix Electra's own small turbines with energy bought from the independent
      producer Cabeólica: for São Vicente, the wind energy is booked under the Matiota station
      (22.82 GWh in 2023), where Electra owns 900 kW and Cabeólica 5.95 MW.
    evidence: https://www.electra.cv/backend/web/uploads/RELAT%C3%93RIOECONTAS2023ELECTRANORTE.pdf
    found: 2026-11-06
notes: >-
  Annual wind production in kWh by island, in table "Quadro 3 - Produção por Ilha" of the
  Electra Norte and Electra Sul reports, with the previous year alongside. 2023 values differ by
  island: Santo Antão 1,479,917 kWh, São Vicente 22,822,592 kWh, Sal 17,740,060 kWh (Electra
  Norte) and Santiago 28,191,458 kWh (Electra Sul). Installed independent wind capacity per
  island is given in the same report. Reports on the site run from 2019 (with 2018 alongside)
  to 2023 for Norte and Sul. Boa Vista does not appear in either report's tables.
