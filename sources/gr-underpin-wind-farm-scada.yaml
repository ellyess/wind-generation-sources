traps:
  - summary: Power columns are labelled in watts but hold kilowatts.
    detail: >-
      'Grid Production Power Avg. [W]' peaks at about 3,001 for each turbine, which only makes
      sense as kW for turbines of about 3 MW. The same unit label is on the possible power and
      reactive power columns.
    evidence: https://zenodo.org/records/14546480
    found: 2026-11-06
  - summary: The farm, turbine model and time zone are not identified.
    detail: >-
      The record says only 'located in Greece'. There are no coordinates, rated power or turbine
      model, and timestamps carry no time zone, so matching to weather data is approximate.
      Added 2026-11-07, observed in the data rather than documented: the stamps are not Greek
      local time, because the WT01 and WT07 data sheets hold rows for 2020-03-29 03:00 to 03:50,
      an hour Greek clocks skipped. Do not convert them from Europe/Athens; UTC and a fixed
      UTC+02:00 both fit.
    evidence: https://zenodo.org/records/14546480
    found: 2026-11-06
notes: >-
  A sample of wind farm SCADA (supervisory control and data acquisition) data from the UNDERPIN
  industrial data space project: one xlsx workbook (181 MB) with a data sheet and an alarm and
  event log sheet for each of ten turbines (WT01 to WT10; the sheets are named as .csv files).
  Each data sheet has 132 ten-minute signals, including active, reactive and possible power,
  grid voltages and currents, wind speed and direction, and component temperatures. Checked by
  downloading the workbook: WT01 and WT02 each have 26,208 ten-minute rows from 2020-01-01 00:00
  to 2020-06-30 23:50, with power values that differ. Possible power is published alongside
  actual power, so curtailed or lost output can be estimated.
status: fixed-release
