  value: period-mean
  evidence: https://zenodo.org/records/14546480
  note: >-
    The Zenodo record describes the data only as SCADA records from 1 January to 30 June 2020; it
    states no time zone and does not say whether a stamp marks the start or end of each 10-minute
    interval. The power column is headed 'Grid Production Power Avg. [W]', so each value is a
    10-minute average, but the magnitudes (peaks near 3,001 per turbine of about 3 MW) fit kW, not W
    (see the trap). Unit is recorded as unknown because the publisher's label and the values disagree.
    Read 2026-11-06 by an automated research pass; not yet reviewed. Checked again 2026-11-07:
    the record still states no zone, so timezone stays unknown. The data rule out Greek local
    time: sheets WT01_data.csv and WT07_data.csv each have 26,208 stamps on an unbroken
    10-minute grid, including 03:00 to 03:50 on 29 March 2020, the hour Greek clocks skipped,
    with no repeats. UTC and fixed UTC+02:00 both fit.
