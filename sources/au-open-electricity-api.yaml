id: au-open-electricity-api
name: Open Electricity API (formerly OpenNEM)
publisher: Open Electricity (The Superpower Institute)
publisher_role: aggregator
countries: [AU]
area: "NEM: QLD, NSW, VIC, SA, TAS; WEM: Western Australia"
level: farm
technology: onshore
measure: metered-energy
resolution: 5min
coverage:
  start: 1998
  update: near real time
capacity: separate-dataset
coordinates: separate-dataset
curtailment: reported
access:
  method: api
  url: https://platform.openelectricity.org.au/
  docs: https://docs.openelectricity.org.au/api-reference/overview
  key_required: true
  registration: true
