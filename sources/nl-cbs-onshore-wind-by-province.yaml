traps:
  - summary: The table holds two production columns, and only one is the observed output.
    detail: >-
      GenormaliseerdeProductie_10 is production normalised for an average wind year (a
      calculated figure for renewable energy target accounting); NietGenormaliseerdeProductie_11
      is the actual production. For 2023 the national figures are 15,717 GWh normalised against
      17,842 GWh actual. Use the non-normalised column for validation.
    evidence: https://opendata.cbs.nl/ODataApi/odata/70960ned/DataProperties
    found: 2026-11-06
  - summary: Production is empty before 2002, although capacity and turbine counts go back to 1990.
    evidence: https://opendata.cbs.nl/ODataApi/odata/70960ned/TypedDataSet?$select=RegioS,Perioden,NietGenormaliseerdeProductie_11,OpgesteldVermogenEindeJaar_9
    found: 2026-11-06
notes: >-
  Per province and year: turbines commissioned, decommissioned and standing at year end, rotor
  area, capacity (MW), normalised and actual production (million kWh), a production factor (%),
  production per rotor area and full-load hours. Offshore wind is excluded. Checked via the
  OData API on 6 November 2026: for 2023 the provinces differ (PV24 4,572 GWh from 1,933 MW;
  PV26 94 GWh from 34 MW), and the latest year was 2024 (revised provisional); the 2025 figures
  were announced as delayed to November 2026. A companion table, 71227ned, gives the same
  measures by hub height.
status: active
