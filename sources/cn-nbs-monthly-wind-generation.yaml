traps:
  - summary: The figure covers only industrial enterprises above designated size, not all wind farms.
    detail: >-
      Every output figure in the release is for enterprises with annual main business revenue of
      20 million yuan or more (规模以上工业). Small and distributed wind below that threshold is
      left out, so the total is lower than national wind generation from other sources. The
      enterprise set changes each year, and year-on-year growth rates are computed on a matched
      base, so they can differ from rates published a year earlier and cannot be reproduced from
      the published levels.
    evidence: https://www.stats.gov.cn/xxgk/sjfb/zxfb2020/202610/t20261019_1965613.html
    found: 2026-11-06
notes: >-
  National monthly wind generation (风力发电量) in 100 million kWh (亿千瓦时, that is 0.1 TWh),
  with the month value, the cumulative year-to-date value and both growth rates, in the table of
  the monthly industrial production release. Checked 2026-11-06: the September 2026 release
  (published 19 October 2026) gives 776 for the month and 8,022 for January to September; the
  August 2023 release (published 15 September 2023) gives 441 and 5,308. Releases before 2023 were
  not checked, so 2023 is the earliest year seen, not the start of the series. NBS's statistical
  database (data.stats.gov.cn) carries the same indicator as a time series and, by its layout,
  provincial monthly values, but it returned HTTP 403 to automated requests on the check date, so
  neither the series start nor the provincial data were seen. No per-plant wind output from China
  was found; the National Energy Administration and China Electricity Council publish national
  capacity and utilisation hours rather than plant series.
