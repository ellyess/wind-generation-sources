id: es-ree-esios-measured-generation
name: ESIOS measured wind generation by province (Generación medida Eólica, indicators 10037, 1159 and 1160)
publisher: Red Eléctrica (REE), system operator information system ESIOS
publisher_role: tso
countries: [ES]
area: Spain, broken down by province
level: zone
technology: onshore-and-offshore-split
measure: metered-energy
resolution: hourly
coverage:
  start: 2015
  update: daily as new meter readings arrive, from the month after (M+1)
capacity: separate-dataset
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: Europe/Madrid
  timestamp: unknown
  unit: MWh
  value: period-total
  evidence: "https://api.esios.ree.es/doc/indicator/getting_a_specific_indicator_filtering_values_by_a_date_range.html"
  note: >-
    The public analysis page for indicator 1159 shows hourly values in MWh (13,325.7 MWh for
    15/01/2025 23:00). The ESIOS API documentation's example response gives each value a local
    "datetime" with its offset (+02:00 in August) and a separate "datetime_utc"; use
    datetime_utc for joins. Neither says whether an hour is labelled by its start or its end;
    the analysis page lists a day's hours as 00:00 to 23:00, which suggests start labels but is
    not stated. The API itself needs a token, so the indicator's own magnitude field was not
    read, and whether Canary Islands provinces use peninsular or Canary time was not checked.
    Read 2026-11-06 by an automated research pass; not yet reviewed.
