traps:
  - summary: The combined wind indicator 10037 was empty on the 2015 and 2019 dates tried, while the onshore indicator 1159 had data.
    detail: >-
      On 2026-11-06 the public analysis page showed no values for 10037 on 15 January 2015 or 15
      January 2019, but 1159 (onshore) showed 10,402.5 MWh and 2,712.4 MWh for 23:00 on those
      days. Use 1159 and 1160 for history.
    evidence: https://www.esios.ree.es/es/analisis/10037?vis=1&start_date=15-01-2019T00%3A00&end_date=15-01-2019T23%3A55&compare_start_date=14-01-2019T00%3A00&groupby=hour&geoids=
    found: 2026-11-06
  - summary: Metered values arrive a month or more late, so recent weeks are empty or incomplete.
    detail: >-
      REE describes publication as daily "each time new measurements arrive, from month M+1".
      For recent periods use the real-time telemetry indicator 551 (see es-ree-esios-real-time-wind)
      and replace it once meter readings are in.
    evidence: https://api.esios.ree.es/indicators
    found: 2026-11-06
notes: >-
  Hourly metered wind generation in MWh for Spain, selectable by province on the public ESIOS
  analysis pages (no token needed in a browser). Checked 2026-11-06 for 1 January 2025, 23:00:
  Spain 5,373.6 MWh, A Coruña (geo id 50) 972.3 MWh and Albacete (geo id 57) 45.8 MWh; 1159
  also returned values for January 2015. The start year is the earliest year looked at, not a
  confirmed first year. REE's indicator list describes 10037 (all wind), 1159 (onshore) and 1160
  (offshore) as metered generation that "can be broken down by provinces". The pages offer
  CSV, JSON and Excel export; bulk access goes through the ESIOS REST API, which needs a
  personal token requested from REE, so the API itself was not tested. Installed wind capacity is indicator 1485. No public per-unit metered wind series was found in ESIOS:
  per-unit data there are scheduled programmes (PBF, P48 and the like), which are not
  observations.
  Corrected 2026-11-07: key_required was false and is now true. Without a token the REST API
  answered {"Status": 403, "message": "Forbidden"} for /indicators/1159, with or without a date
  range, while the indicator list (/indicators) answered 200. The API documentation
  (https://api.esios.ree.es/) opens with a "Personal token request" link to
  https://www.esios.ree.es/es/token, a form asking for name, surname, email and reason for use
  (the form names no fee), and its example requests send the token in an x-api-key header. The
  analysis pages can still be browsed without a token, but any programmatic or bulk route needs
  one.
status: active
