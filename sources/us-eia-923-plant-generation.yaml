id: us-eia-923-plant-generation
name: Form EIA-923 Power Plant Operations Report (net generation by plant)
publisher: US Energy Information Administration (EIA)
publisher_role: statistics-office
countries: [US]
level: farm
technology: onshore-and-offshore-combined
measure: reported-generation
resolution: monthly
coverage:
  start: 2001
  update: monthly (August 2026 data released 2026-10-23); final annual data about nine months after the year
capacity: separate-dataset
coordinates: separate-dataset
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: MWh
  value: period-total
  evidence: https://www.eia.gov/electricity/data/eia923/archive/xls/f923_2024.zip
  note: >-
    Monthly columns "Netgen January" to "Netgen December" sit under "Electricity Net Generation
    (MWh)", with an annual "Net Generation (Megawatthours)" column. For annual respondents coded
    "A" the monthly values are EIA imputations; "AM" records, which all annual wind respondents
    carry from 2023, hold reported months (see traps; corrected 2026-11-07). Read 2026-11-06 by
    an automated research pass; not yet reviewed.
access:
  method: bulk-download
  url: https://www.eia.gov/electricity/data/eia923/
  key_required: false
  registration: false
  formats: [xlsx, zip]
  languages: [en]
licence:
  name: US government work, public domain
  url: "https://www.eia.gov/about/copyrights_reuse.php"
  redistribution: allowed-with-attribution
  attribution: "Source: U.S. Energy Information Administration (with the publication date, for example \"(Oct 2008)\")"
  verified: true
  note: >-
    Photos, contributed private documents and the EIA logo are excluded. Corrected 2026-11-08: the
    attribution said "with the date of access"; EIA's page asks for "an acknowledgment, which
    includes the publication date", with the example "Source: U.S. Energy Information Administration
    (Oct 2008)." Changed 2026-11-08 (maintainer decision) from allowed to allowed-with-attribution,
    because EIA asks for an acknowledgment.
traps:
  - summary: >-
      Up to 2022 most wind plants were annual respondents whose months EIA fills in; from 2023
      they are coded "AM" and report real monthly values once a year, so keep "AM" as well as "M".
    detail: >-
      In 2021, 777 of 1,279 wind plants were annual ("A") respondents whose monthly values are
      imputed by EIA; 2022 had 775 "A" and 533 "M". Filter out "A" records for any monthly
      analysis. Corrected 2026-11-07: from the 2023 file the wind rows carry no "A" at all. The
      2024 file has 753 wind plants coded "AM" (123.0 TWh) and 594 coded "M" (327.5 TWh); 2023
      has 767 "AM" and 568 "M". The 2023 and 2024 "Page 7 File Layout" sheets define only "M
      Monthly respondent" and "A Annual respondent", but the 2021 file's layout defines "AM" as
      "The respondent provides monthly values for this record, but does so once per year via the
      EIA-923 annual survey form", and "A" as records where "Any monthly data in this record is
      estimated". The current form instructions (page 16) say annual respondents with wind
      "report operational data for all prime movers and energy source types for each month".
      The values show the difference: Snake River (plant 90) reads 184.495, 140.449, 175.033 MWh
      for January to March 2021 as "A", and 202, 266, 243 MWh in 2024 as "AM". Keep "M" and
      "AM"; drop "A". Keeping only "M" loses more than half the wind plants.
    evidence: https://www.eia.gov/survey/form/eia_923/instructions.pdf
  - summary: Net generation is net of station use, so it runs a little below gross output and can be negative in a calm month.
    detail: >-
      Negative monthly values occur on monthly ("M") wind records: Cape Cod Air Force Station - 6
      SWS (plant 58661) reads -8.0 MWh in June 2019 and Tatanka Wind Power LLC (plant 56669)
      -109.0 MWh in February 2021. Keep them rather than clipping to zero. Detail added
      2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/src/pyvwf/sources/eia_us.py#L65-L68
  - summary: Coordinates and nameplate are in a separate form (EIA-860), and a few plants use a placeholder code that joins to nothing.
    detail: >-
      Join on plant code to EIA-860. In 2021 one plant (code 99999 and similar placeholders) did
      not join. Hub heights are not in either form; the US Wind Turbine Database (USGS) has them.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/us.md
  - summary: The file covers Alaska and Hawaii, which fall outside a contiguous-US domain.
    detail: Filter by location before matching plants to a gridded wind field.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/us.md
  - summary: The generation sheet has a title block above its header row, and multi-word column names break across two lines, so exact name matching fails.
    detail: >-
      In "Page 1 Generation and Fuel Data" the column header is on row 6 in the 2019 to 2022
      final files. Headers such as "Reported Fuel Type Code", "Respondent Frequency" and "Netgen
      January" carry a line break inside the cell. Collapse whitespace in the headers before
      selecting columns. Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/src/pyvwf/datasets/eia_us.py#L123-L128
  - summary: A plant can appear on two wind rows in one year, each holding "." for the months it does not cover; sum the rows and read "." as missing, not zero.
    detail: >-
      In the 2020 file Willmar (plant 2022) has one wind row flagged as a combined heat and power
      plant ("Y") with net generation for January to June (581.988 MWh in January) and "." for
      July to December, and a second row ("N") with "." for January to June and values from July
      (395.504 MWh). Wind rows with "." in at least one monthly net generation cell number 49,
      108, 64 and 39 in the 2019 to 2022 final files. Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/src/pyvwf/datasets/eia_us.py#L101-L105
tools:
  - name: PUDL (Public Utility Data Liberation)
    url: https://github.com/catalyst-cooperative/pudl
    language: Python
notes: >-
  Plant-level monthly net generation for the whole US fleet, about 133 GW of wind in 2021. Pair it
  with EIA-860 (nameplate, coordinates) and the US Wind Turbine Database
  (https://energy.usgs.gov/uswtdb/) for hub heights. Files from 2001 to 2007 come from the
  predecessor forms EIA-906 and EIA-920, on the same page. Corrected 2026-11-07: the first trap
  and the conventions note said annual wind respondents are always "A" with imputed months; the
  2023 and 2024 files code them "AM" (monthly values reported once a year), as the trap now
  explains. Checked 2026-11-08: Hawaii is covered, Puerto Rico is not. The 2022, 2024 and 2025
  files each hold seven Hawaii wind plants (Pakini Nui, Kaheawa Pastures, Kaheawa Wind Power II,
  Kahuku, Kawailoa, Auwahi and Na Pua Makani; 111,762 MWh for Pakini Nui in 2024) plus a
  "State-Fuel Level Increment" row (plant 99999) for Hawaii wind. No file has a Puerto Rico row:
  the Plant State column holds the 50 states and DC only, so for Puerto Rico's wind farms use
  EIA's annual territory total in world-eia-international.
status: active
