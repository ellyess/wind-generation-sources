traps:
  - summary: South Africa's onshore wind generation is about 30 times too low in 2022-2024.
    detail: >-
      IRENASTAT gives 331 GWh for 2024 (300 GWh for 2023) against 3,442 MW installed, a capacity
      factor near 1%. Ember's monthly series sums to 11.1 TWh for 2024. Found by the catalogue's
      annual cross-check on 2026-11-06; compare any single country against a second source
      before use.
    evidence: https://pxweb.irena.org/pxweb/en/IRENASTAT/IRENASTAT__Power%20Capacity%20and%20Generation/Country_ELECSTAT_2026_H2_PX.px/
    found: 2026-11-06
  - summary: The latest year of generation is preliminary and, per IRENA, "not accurate at aggregate levels".
    detail: >-
      The table note says 2024 electricity generation is preliminary. Generation runs to 2024 while
      capacity runs to 2025, so the 2025 generation cells are empty.
    evidence: https://pxweb.irena.org/pxweb/en/IRENASTAT/IRENASTAT__Power%20Capacity%20and%20Generation/Country_ELECSTAT_2026_H2_PX.px/
    found: 2026-11-06
  - summary: Generation is gross and includes off-grid and self-consumed output, so it runs above transmission-operator series.
    detail: >-
      The table note defines generation as gross output measured at the generator terminals,
      including on-grid and off-grid generation and electricity self-consumed in energy
      industries. Select Grid connection = All, On-grid or Off-grid explicitly.
    evidence: https://pxweb.irena.org/pxweb/en/IRENASTAT/IRENASTAT__Power%20Capacity%20and%20Generation/Country_ELECSTAT_2026_H2_PX.px/
    found: 2026-11-06
  - summary: The table file name changes with each half-yearly release.
    detail: >-
      The current table is Country_ELECSTAT_2026_H2_PX.px; earlier links point at older
      releases. List the folder through the API to find the current one.
    evidence: https://pxweb.irena.org/api/v1/en/IRENASTAT/Power%20Capacity%20and%20Generation/
    found: 2026-11-06
  - summary: >-
      Kenya's 2024 wind is about 4% of the regulator's grid total, close to the state-owned
      farm's output alone.
    detail: >-
      IRENASTAT gives 0.076 TWh for Kenya in 2024. EPRA's Bi-Annual Energy and Petroleum
      Statistics Report 2024/2025 (Figure 3.7) labels "H1 2024 825.77" and "H2 2024 971.9"
      GWh, 1,797.67 GWh for the calendar year, which Ember matches. KenGen's 2024 annual
      report gives its own wind as "Wind 50 57" GWh for its last two fiscal years, so
      IRENA's figure may leave out the private farms (Lake Turkana, Kipeto); that is
      suspected, not proven. Found by an automated research pass on 2026-11-07; not yet
      reviewed by a person.
    evidence: https://www.epra.go.ke/sites/default/files/2025-03/Bi-Annual%20Energy%20%26%20Petroleum%20Statistics%20Report%202024_2025.pdf
    found: 2026-11-07
  - summary: >-
      Russia's 2024 wind is about 37% below the system operator's figure.
    detail: >-
      IRENASTAT gives 5.5 TWh for Russia in 2024 (Ember 4.925). The system operator SO-UPS's
      chart of 2024 results reads "ВЭС 8 794,1" million kWh for wind, with solar listed
      separately ("СЭС 2 992,7"), so the gap is not solar counted in. EIA's 8.279 is close
      to SO-UPS. The cause is not established. The SO-UPS figure was read from a chart image
      on the page below. Found by an automated research pass on 2026-11-07; not yet reviewed
      by a person.
    evidence: https://www.so-ups.ru/functioning/ups/ups2025/
    found: 2026-11-07
notes: >-
  Annual electricity generation (GWh) and installed capacity (MW) by country, technology and grid
  connection, from 2000, with onshore and offshore wind as separate technologies (19 countries had
  offshore generation). IRENA compiles it from its annual questionnaire to national focal points
  and other official sources; whether a given cell is a national figure or an IRENA estimate is not
  flagged in the table. Some small territories (for example South Georgia, Tokelau) carry small
  wind values. Checked by querying the PxWeb API (POST, json-stat2, no key) for onshore and
  offshore wind generation and capacity in every country on the check date. Useful for its breadth
  and its capacity denominator; for any single country, prefer the national source.
