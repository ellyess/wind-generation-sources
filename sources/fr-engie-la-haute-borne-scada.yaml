id: fr-engie-la-haute-borne-scada
name: La Haute Borne wind farm SCADA data (ENGIE open data, now mirrored)
publisher: ENGIE (original); re-deposited on Mendeley Data by AGH University of Krakow authors
publisher_role: owner-operator
countries: [FR]
area: La Haute Borne wind farm, Meuse, Grand Est (4 Senvion MM82 turbines, 2.05 MW each)
level: turbine
technology: onshore
measure: reported-generation
resolution: 10min
coverage:
  start: 2013
  end: 2018
  update: none; ENGIE's portal is offline and the mirror is a fixed copy ending 13 January 2018
capacity: included
coordinates: included
curtailment: not-reported
conventions:
  timezone: Europe/Paris
  timestamp: unknown
  unit: kW
  value: period-mean
  evidence: "https://data.mendeley.com/datasets/vmyg4yp3s8/2"
  note: >-
    Date_time carries French local time with its offset (2013-01-01T00:00:00+01:00, +02:00 in
    summer). data_description.csv gives Active_power in kW, and the record says the average,
    standard deviation, maximum and minimum were collected for each 10-minute interval, so P_avg
    is the interval mean. Whether the stamp opens or closes the interval is not stated. Read
    2026-11-06 by an automated research pass; not yet reviewed.
