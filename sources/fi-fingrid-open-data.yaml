traps:
  - summary: Dataset 75 is hourly before 13 June 2023 and 15-minute after.
    detail: Resample or flag the change before computing statistics across that date.
    evidence: https://data.fingrid.fi/en/datasets/75
  - summary: About two percent of capacity is estimated by Fingrid, not measured.
    detail: >-
      The series sums parks connected with Fingrid measurements and adds Fingrid's estimate for
      parks without them, about two percent of capacity.
    evidence: https://data.fingrid.fi/en/datasets/75
  - summary: The capacity series that goes with it is not the official installed capacity.
    detail: >-
      Dataset 268 is the capacity used in Fingrid's wind forecast, updated by hand about weekly.
      Fingrid says it cannot be considered the official amount of wind capacity in Finland.
    evidence: https://data.fingrid.fi/en/datasets/268
notes: >-
  National Finnish wind generation in MW. Dataset 75 is the 15-minute series (valid from
  2014-11-28, hourly before June 2023); dataset 181 is a 3-minute real-time series from Fingrid's
  operation control system, valid from 2014-01-01. The schema has no 3-minute value, so the
  resolution is given as 15min. The API needs a free key (x-api-key header), limited to 10,000
  requests a day and one every two seconds. No key was available on 2026-11-06, so the data
  themselves were not downloaded: the start years are as stated by the publisher, and formats
  are left out. Capacity is in dataset 268 (from 2015-03-10).
