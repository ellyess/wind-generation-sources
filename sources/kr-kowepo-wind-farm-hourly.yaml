  note: >-
    The description calls the data hourly generation aggregated by the hour (시간 단위로 집계된 발전
    현황), with columns 01시 to 24시; the column definitions give no unit for them, and give capacity
    in MW. The Hwasun values fit kWh (peaks of about 15,000 to 16,800 for a 16 MW farm); most
    Jangheung values are 1,000 times larger (see traps). The page does not say whether 01시 is
    the hour starting or ending at 01:00, nor the time zone. Read 2026-11-08 by an automated
    research pass; not yet reviewed.
