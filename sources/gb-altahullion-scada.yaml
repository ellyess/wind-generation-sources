  evidence: "https://zenodo.org/records/19948235"
  note: >-
    The record describes 10-minute statistics, and scada_df_ALTA2_20250904_20260301.parquet has
    a TimeStamp index with no time zone and per-station columns ActPower_Value_mean, _min, _max
    and _stddev. Neither the record nor the files give a unit for active power; values peak near
    1,330 on 1.3 MW turbines, which reads as kW, but the unit is recorded as unknown until stated.
    Whether the stamp opens or closes the period is not stated. Read 2026-11-06 by an automated
    research pass; not yet reviewed. Checked again 2026-11-07: the Zenodo description states no
    time zone, so timezone stays unknown, and the data cannot settle it. The series ends on
    1 March 2026, before the spring clock change, so the only change it spans is 26 October
    2025, when UK clocks repeated an hour. In the 10-minute file 01:00 to 01:50 on that day
    appear once each, and in the T11 one-minute file every minute appears once (no repeated
    stamps in either file). That fits UTC, but a local-time logger that overwrote the repeated
    hour would look the same.
