id: ru-so-ups-dpm-res-monthly
name: Actual operation of renewable plants under capacity supply agreements, monthly (Режим работы объектов ДПМ ВИЭ)
publisher: System Operator of the Unified Energy System of Russia (АО «СО ЕЭС», SO UPS)
publisher_role: tso
countries: [RU]
area: >-
  Russian regions (federal subjects) with wind plants under the renewable capacity supply
  agreement scheme (ДПМ ВИЭ), grouped by interconnected power system
level: zone
technology: onshore
measure: reported-generation
resolution: monthly
coverage:
  start: 2021
  update: monthly, irregularly, between about two and ten weeks after the month
capacity: included
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: MWh
  value: period-total
  evidence: https://www.so-ups.ru/fileadmin/files/company/markets/2026/res/res_aug_26.pdf
  note: >-
    Each monthly PDF headed "Информация о фактическом режиме работы объектов ДПМ ВИЭ" gives
    "Выработка, тыс. кВтч" (output in thousand kWh, which is MWh) twice: from the start of the
    year and in the reporting month. Installed capacity is in MW as entered in the register of
    capacity supply limits on the first day of the month. Read 2026-11-08 by an automated research
    pass; not yet reviewed.
