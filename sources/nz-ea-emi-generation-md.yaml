id: nz-ea-emi-generation-md
name: Generation output by plant (Electricity Market Information, Generation_MD)
publisher: Electricity Authority (Te Mana Hiko)
publisher_role: regulator
countries: [NZ]
level: connection-point
technology: onshore
measure: metered-energy
resolution: 30min
coverage:
  start: 1997
  update: monthly
capacity: separate-dataset
coordinates: none
curtailment: not-reported
conventions:
  timezone: Pacific/Auckland
  timestamp: period-start
  unit: kWh
  value: period-total
  evidence: https://www.emi.ea.govt.nz/Wholesale/Datasets/Generation/Generation_MD/
  note: >-
    The dataset page says units are kilowatt hours, data are by trading period TP1 to TP48, trading
    period 1 starts at midnight and trading period 2 at 12:30 am, and days have 46 trading periods
    when daylight saving starts and 50 when it ends; the zone is New Zealand local time by that
    note, though not named. Periods are identified by number, not clock time. The page says values
    are estimated by mapping metered grid injections to plants. Read 2026-11-06 by an automated
    research pass; not yet reviewed.
access:
  method: bulk-download
  url: https://www.emi.ea.govt.nz/Wholesale/Datasets/Generation/Generation_MD/
  key_required: false
  registration: false
  formats: [csv]
  languages: [en]
licence:
  name: Creative Commons Attribution 4.0
  spdx: CC-BY-4.0
  url: "https://www.emi.ea.govt.nz/LegalInformation/"
  redistribution: allowed-with-attribution
  attribution: www.emi.ea.govt.nz provided by the Electricity Authority (New Zealand)
  verified: true
  note: EMI tools and models are under a separate licence; third-party works and restricted information-request data are excluded.
traps:
  - summary: Days have 46, 48 or 50 trading periods because of daylight saving; map periods to UTC through Pacific/Auckland.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/nz.md
  - summary: Site codes are not stable across years; key farms on Gen_Code instead.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/nz.md
  - summary: Some farms are metered at several connection points and must be summed.
    detail: West Wind and Tararua I and II, for example.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/nz.md
  - summary: Not every wind farm appears as wind.
    detail: >-
      Mahinerangi is metered inside the Waipori hydro scheme. About 28 MW of small farms on the
      distribution network are outside the dataset.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/nz.md
  - summary: >-
      Newer plants carry short fuel codes, so a filter on Fuel_Code "Wind" misses some wind
      farms.
    detail: >-
      Older plants have Fuel_Code "Wind" and Tech_Code "Wind"; plants added recently have
      Fuel_Code "WIN" and Tech_Code "ONW". kaiwera_downs_(stage_2) first appears in the March
      2026 file that way, for example the row "KIW,KIW2201,MRPL,kaiwera_downs_(stage_2),WIN,ONW,
      2026-04-01,0,0,..." in 202604_Generation_MD.csv, while the first stage stays "KaiweraDowns,
      Wind,Wind" at GOR0331. The September 2026 file adds kaiwaikawe_wind_farm (MPE1101) as WIN
      and ONW too. Other fuels have the same split from 2025 (SOL beside Solar, HYD beside Hydro,
      GEO beside Geo, and ELE for batteries). Select wind with Fuel_Code in "Wind" and "WIN", and
      check the codes in each new file. Found by an automated research pass on 2026-11-07; not
      yet reviewed by a person.
    evidence: https://www.emi.ea.govt.nz/Wholesale/Datasets/Generation/Generation_MD/202604_Generation_MD.csv
    found: 2026-11-07
  - summary: One point of connection can carry two different wind farms, so connection codes do not identify a farm either.
    detail: >-
      Tararua III and Te Rere Hau both inject at TWC2201 and are told apart only by Gen_Code
      (twf_3 and te_rere_hau). Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/configs/curation/nz_wind_farms.csv?plain=1#L3-L6
    found: 2026-07-22
  - summary: Column names and plant codes change capitalisation between files.
    detail: >-
      The 2019 files name the date column Trading_date; later files say Trading_Date. Gen_Code
      spellings vary too: Harapaki is capitalised, and Kaiwera Downs stage 1 is KaiweraDowns with
      no underscore, beside lower-case codes such as te_apiti. Match column names and codes
      without regard to case. Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/src/pyvwf/datasets/emi_nz.py#L407-L410
    found: 2026-07-22
  - summary: The plant register's capacity is not always turbine capacity; for West Wind it is the rating of its two connections.
    detail: >-
      The register lists West Wind as 80 MW plus 80 MW, while its 62 turbines of 2.3 MW make
      142.6 MW. For Tararua stages I and II it gives 73 MW against 103 turbines of 660 kW
      (67.98 MW), a difference PyVWF has not resolved. Check the register against turbine counts
      before dividing output by it. Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/configs/curation/nz_wind_farms.csv?plain=1#L2-L7
    found: 2026-07-22
  - summary: A farm built in stages can keep one Gen_Code, so its output ramps up over months or years with no change of code.
    detail: >-
      Turitea's North stage (33 turbines) and South stage (27 turbines) both report as turitea.
      PyVWF divides by 118.8 MW from November 2021 and 221.4 MW from January 2024; holding the
      North-stage figure while the South stage was commissioning gave capacity factors above 1 in
      September and October 2023. Use a dated capacity history and leave out commissioning
      months. Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/configs/curation/nz_capacity_stages.csv?plain=1#L2-L3
notes: >-
  Half-hourly metered injection for every grid-connected generator, monthly files from August
  1997. About 13 dispatched wind farms and 1.5 GW in 2024. The plant register gives capacity and
  commissioning but no coordinates or hub heights. The Electricity Authority has said it plans to
  replace Generation_MD with a richer dataset.
status: active
last_checked: 2026-11-07
checked_by: Ellyess Benmoufok and Claude Code; traps from the PyVWF runbook, earliest month read from the EMI listing; licence read on the publisher's page 2026-11-06
