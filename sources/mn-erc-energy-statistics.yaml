traps:
  - summary: Recent editions are flipbooks rather than files, so the wind row has to be read off the page.
    detail: >-
      The statistics page links the 2020 editions as PDFs on admin.erc.gov.mn (English, 88
      pages, 12 MB) and the later editions, including Statistics on Energy Performance 2025, as
      fliphtml5 flipbooks with no file download found; in the 2025 English edition each page,
      including the generation table on page 16, is a picture with no text to copy (checked
      2026-11-08). Per-farm output is not tabulated; the
      edition read gives individual wind farms only as contributions to the winter peak (Salkhit
      19 MW, Tsetsii 33 MW and Sainshand 1 MW on 2020-12-15). Found by an automated research
      pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://erc.gov.mn/mn/statistic
    found: 2026-11-08
notes: >-
  Annual national wind generation for Mongolia, from the energy regulator's statistics book.
  The 2020 edition covers 2015 to 2020. The 2025 English flipbook
  (https://online.fliphtml5.com/seigx/ERC-statistic---2025-eng/), linked from the same page, was
  read on 2026-11-08 and covers 2021 to 2025, so the two editions together give 2015 to 2025
  with no gap; no edition was found that overlaps both, so revisions between them could not be
  checked. In the 2025 edition the wind row adds up with the other rows to the stated total
  generation within 0.1, and its pie chart gives wind 532.6 million kWh, 60.7% of 877.5 million
  kWh of renewable output in 2025. No monthly or per-farm series was found. The Mongolian-language 2020
  edition (http://admin.erc.gov.mn/uploads/files/statistic/erchim-huch_suuliinh_04-10_final.pdf)
  carries the same wind row.
