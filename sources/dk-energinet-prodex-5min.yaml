traps:
  - summary: These are upscaled real-time measurements, and errors are generally not corrected.
    detail: >-
      The publisher says the values come from upscaled SCADA (control-system) measurements and
      points to the settlement dataset for statistical use. Treat this as an operational
      estimate, not metered energy.
    evidence: https://api.energidataservice.dk/meta/dataset/ElectricityProdex5MinRealtime
  - summary: The October 2026 clock change left a permanent gap.
    detail: >-
      Values between 2026-10-25 00:00 and 01:00 UTC are missing and the publisher says they will
      not be added.
    evidence: https://api.energidataservice.dk/meta/dataset/ElectricityProdex5MinRealtime
  - summary: The start and end query parameters are read as Danish local time, not UTC.
    detail: Use the Minutes5UTC column for joins.
    evidence: https://www.energidataservice.dk/guides/api-guides
notes: >-
  Five-minute power (MW) per Danish price area, with onshore and offshore wind as separate
  columns. Offshore includes large parks and local turbines located offshore. Checked
  2026-11-06: the earliest record is 2015-01-01 local time, and DK1 and DK2 return different
  values. Listed separately from the settlement dataset because it is a different measure and
  resolution. Capacity is in the CapacityPerMunicipality dataset.
