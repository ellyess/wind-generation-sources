id: tw-taipower-unit-generation
name: Taipower generation by unit, real-time (各機組發電量即時資訊) and past (各機組過去發電量)
publisher: Taiwan Power Company (Taipower), via the Government Open Data Platform (data.gov.tw)
publisher_role: utility
countries: [TW]
level: farm
technology: onshore-and-offshore-combined
measure: reported-generation
resolution: 10min
coverage:
  start: 2026
  update: real-time file every 10 minutes; past file replaced monthly with a three-month window about three months behind
capacity: included
coordinates: none
curtailment: not-reported
access:
  method: bulk-download
  url: https://data.gov.tw/dataset/8931
  docs: https://data.gov.tw/dataset/37331
  key_required: false
  registration: false
  formats: [json]
  languages: [zh]
licence:
  name: Open Government Data License, version 1.0 (政府資料開放授權條款－第1版)
  url: https://data.gov.tw/license
  redistribution: allowed-with-attribution
  attribution: Name the providing agency (Taiwan Power Company), the year and the dataset name, and state that it is released under the Open Government Data License.
  verified: true
  note: >-
    Free, non-exclusive, irrevocable use for any purpose, including redistribution and
