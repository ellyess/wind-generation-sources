publisher_role: tso
countries: [GE]
level: farm
technology: onshore
measure: reported-generation
resolution: monthly
coverage:
  start: 2016
  update: monthly; the current year's file is replaced as months are added
capacity: none
coordinates: none
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: GWh
  value: period-total
  evidence: "https://admin.gse.com.ge/storage/files/shares/content_files/2026_10_Eng.pdf"
  note: >-
    The 2026 balance is headed "(Mln.kWh)", million kWh, which equals GWh, with one column per
