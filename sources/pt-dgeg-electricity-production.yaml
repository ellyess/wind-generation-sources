traps:
  - summary: The monthly files are provisional and cover mainland Portugal only.
    detail: >-
      The 2025 monthly file (dated 2026-02-02) is headed "Portugal Continental (dados
      provisórios)" and gives 13,595 GWh of gross wind for 2025; the annual workbook updated
      2026-10-16 gives 13,574 GWh for the mainland in 2025. The Azores and Madeira appear only in
      the annual workbook. Found by an automated research pass on 2026-11-08; not yet reviewed by
      a person.
    evidence: https://www.dgeg.gov.pt/pt/estatistica/energia/eletricidade/producao-mensal-de-eletricidade/
    found: 2026-11-08
  - summary: File links carry random path segments and the newest file is replaced, so URLs are not stable.
    detail: >-
      The 2026 monthly file is /media/uemlppcm/dgeg-epm-2026-09.xls and the annual file
      /media/u2ydwgfi/dgeg-epa-2005-2025.xlsx; an older annual file for 2005-2022 sits beside it.
      Take links from the statistics pages rather than building them. Found by an automated
      research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.dgeg.gov.pt/pt/estatistica/energia/eletricidade/producao-anual-e-potencia-instalada/
    found: 2026-11-08
notes: >-
  Annual gross production by source (wind row "EÓLICA") for Portugal, the mainland
  (Continente), the Azores and Madeira, in one workbook for 2005 to 2025 and another for 1994 to
  2004 (wind 17 GWh in 1994). In 2025 wind was 13,777 GWh for Portugal: 13,574 mainland, 68
  Azores and 135 Madeira. Monthly gross and net production by source for the mainland comes as
  one workbook per year from 2012 (2025: 1,822 GWh gross wind in January, 716 in June). Installed
  capacity by plant type (2008-2025) and by municipality (2010-2024) are separate workbooks on
  the annual page. For quarter-hourly mainland data see pt-ren-datahub-production-breakdown.
status: active
reviewed: false
