id: ch-energy-dashboard-swissgrid-production
name: "energiedashboard.ch: Electricity production Swissgrid (Stromproduktion Swissgrid, ogd104)"
publisher: Swiss Federal Office of Energy (SFOE / BFE), from Swissgrid data
publisher_role: government
countries: [CH]
level: country
technology: onshore
measure: reported-generation
resolution: daily
coverage:
  start: 2015
  update: daily
capacity: none
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: unknown
  timestamp: period-label
  unit: GWh
  value: period-total
  evidence: https://energiedashboard.ch/api/v1/datasets/stromproduktion-swissgrid
  note: >-
    Daily values labelled by date: the API schema gives datum as a date and produktion_gwh as
    a number, and the CSV header is "Datum,Energietraeger,Produktion_GWh". Neither the API guide
    (https://www.bfe-ogd.ch/apiguide_edb_de_en.pdf) nor the dataset schema says which time zone
    defines the day. The opendata.swiss dataset page returned HTTP 403 to the check, so its
    description was not read.
    Read 2026-11-06 by an automated research pass; not yet reviewed.
access:
