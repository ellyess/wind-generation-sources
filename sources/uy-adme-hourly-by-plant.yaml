traps:
  - summary: Asking for a month before January 2019 silently returns January 2019 instead of an error.
    detail: >-
      Requests for March 2010 and March 2015 both came back as 1-31 January 2019 under the
      requested file name. Check the dates in the file, not the name.
    evidence: https://www.adme.com.uy/panelControl/variables_excel.php?anod=2015&mesd=03&anoh=2015&mesh=03&periodo=1&tipo=1&central%5B%5D=65
    found: 2026-11-06
  - summary: >-
      Asking for several plants in one request gives a correct series only for the first plant
      column; the others read zero or close to it, which looks like a farm with no output.
    detail: >-
      Corrected 2026-11-07: this trap first said Pampa and Valentines read zero all month while
      Artilleros and Florida I were normal, and advised dropping near-zero plants. Rechecking on
      2026-11-07 showed the zeros come from how the request is made. For March 2025, Pampa (panel
      id 119) requested alone sums to 29,887 MWh and Valentines (128) alone to 16,335 MWh. In the
      three-plant request below (ids 65, 128, 119) the columns come back as Florida I 10,490 MWh,
      Pampa 30 MWh and Valentines 0 MWh. Florida I alone is 10,490 MWh, but beside Artilleros
      (ids 5 and 65) it reads 14 MWh while Artilleros keeps its 11,027 MWh; first rows of that
      file: "01-03-2025 01:00;54.173;54.173;0.036;0.036;" then
      "01-03-2025 02:00;21.367;21.367;0;0;". September 2026 shows the same: Pampa 36,814 MWh
      alone, Valentines 20,345 MWh alone, but 15 MWh for Valentines beside Pampa. The first column
      in the file is not always the first plant in the request (ids 128 then 119 came back Pampa
      first), so check which plant is first. Request one plant at a time.
    evidence: https://www.adme.com.uy/panelControl/variables_excel.php?anod=2025&mesd=03&anoh=2025&mesh=03&periodo=1&tipo=1&central%5B%5D=65&central%5B%5D=128&central%5B%5D=119
    found: 2026-11-06
  - summary: The CSV can start with PHP warning text, and the injection and extraction columns are identical.
    detail: >-
      Several requests returned HTML warning lines before the semicolon-separated table. Skip
      lines until the plant-name header. "Inyecciones" and "Extracciones" matched in every row
      checked, so use one. Rechecked 2026-11-07: the warnings ("Undefined array key 2 in
      .../variables_excel.php on line 314") appeared in the three-plant request below (2,896
      lines before the header) and in the same request for March 2025, but not in any one-plant
      or two-plant request tried.
    evidence: https://www.adme.com.uy/panelControl/variables_excel.php?anod=2026&mesd=09&anoh=2026&mesh=09&periodo=1&tipo=1&central%5B%5D=65&central%5B%5D=128&central%5B%5D=119
    found: 2026-11-06
  - summary: A month not yet published comes back as a full month of zeros, not an error.
    detail: >-
      On 2026-11-08, Florida I (id 65) for October 2026 returned 744 hourly rows from
      "01-10-2026 01:00;0;0;" to "01-11-2026 00:00;0;0;", every value 0, after a PHP warning
      ("Undefined variable $valoresMeses ... on line 314"); September 2026 for the same plant
      has normal values (24.617 MWh in its first hour). A calm month cannot be all zeros, so treat
      an all-zero month, or the warning, as not yet published. Found by an automated research
      pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.adme.com.uy/panelControl/variables_excel.php?anod=2026&mesd=10&anoh=2026&mesh=10&periodo=1&tipo=1&central%5B%5D=65
    found: 2026-11-08
notes: >-
  Hourly energy in MWh for each generating plant in Uruguay, chosen from a list of about 130
  plants, imports and exports, from the "Datos de operación" panel (form variables_excel.php,
  hourly or monthly, CSV or xlsx). Checked per plant: Artilleros and Florida I give different
  hourly series (11,027 and 10,490 MWh in March 2025). ADME also distributes ADME_DATA, a desktop
  and command-line program for raw ten-minute SCADA series per plant, including wind speed and
  direction from plant weather stations, described on https://adme.com.uy/imasd/adme_data.html
  as unprocessed and unvalidated. That ten-minute route was not tested here (it needs the program
  installed), so its history depth is unverified.
status: active
