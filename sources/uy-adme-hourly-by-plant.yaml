id: uy-adme-hourly-by-plant
name: Datos de operación, variables horarias por central (hourly injections by plant)
publisher: Administración del Mercado Eléctrico (ADME)
publisher_role: market-operator
countries: [UY]
level: farm
technology: onshore
measure: metered-energy
resolution: hourly
coverage:
  start: 2019
  update: monthly (latest month at the check was September 2026)
capacity: none
coordinates: none
curtailment: unknown
access:
  method: portal
  url: https://adme.com.uy/controlpanel.php
  key_required: false
  registration: false
  formats: [csv, xlsx]
  languages: [es]
licence:
  name: No terms found
