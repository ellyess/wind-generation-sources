traps:
  - summary: Each release is a first result that becomes final only when the next month's release is published.
    detail: Re-read the following month's release before using a value; the earlier PDF is not updated.
    evidence: https://fzs.ba/wp-content/uploads/2025/05/22.2.4.pdf
    found: 2026-11-06
  - summary: Covers one entity of Bosnia and Herzegovina, not the country.
    detail: >-
      The national statistics agency's monthly release (bhas.gov.ba, ENE_01) covers the whole
      country but merges wind and solar into one row ("VE i SE"), so this entity release is the
      only wind-only monthly figure found for Bosnia and Herzegovina.
    evidence: https://bhas.gov.ba/data/Publikacije/Saopstenja/2024/ENE_01_2024_07_1_HR.pdf
    found: 2026-11-06
notes: >-
  Monthly gross and net electricity production of the Federation of Bosnia and Herzegovina by
  hydro, thermal and wind plants (Vjetroelektrane), in GWh, from FZS's monthly survey of electricity
  production (EN-EE-M). Gross production is measured at the generator terminals; wind own
  consumption is reported as nil, so gross and net wind are equal. Each release gives two months
  of the current and previous year and the year to date. Checked in the July 2023 release (wind 22
  and 33 GWh for June and July 2022) and the April 2025 release (40 and 25 GWh for March and April
  2024, 71 and 65 GWh for March and April 2025). The release index page renders its file list with
  JavaScript; the PDFs follow the pattern /wp-content/uploads/YYYY/MM/22.2.N.pdf, where N is the
  release number in the year.
  Corrected 2026-11-08: coverage start was 2022 and is now 2021. The January 2021 release
  (https://fzs.ba/wp-content/uploads/2021/02/22.2.1.pdf, published 26.02.2021) gives wind gross
  production of 25 GWh for January 2021, with dashes for October 2019 to January 2020 and for
  October to December 2020; the releases for 2019 and 2020 have no wind row at all. The latest
  release found on 2026-11-08 is 22.2.9 (September 2026, wind 46 GWh).
