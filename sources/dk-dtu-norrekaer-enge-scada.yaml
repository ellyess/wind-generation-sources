traps:
  - summary: The licence on the repository record and the licence inside the files disagree.
    detail: >-
      DTU Data lists CC BY 4.0. The NetCDF attributes give license 'CC BY NC 4.0' and a
      distribution statement requiring contact with DTU Wind Energy before commercial use.
    evidence: https://doi.org/10.11583/DTU.19076756
    found: 2026-11-06
  - summary: The files hold power for 40 turbines although the description says 42.
    detail: >-
      norre_m2_concurent.nc has 40 active power variables (a2 to f7, with a1 and f6 absent). Many
      turbine positions in the site documentation are placeholders of (1,1,0), so the layout has
      to be taken from the drawings or the Risø report rather than the coordinate list.
    evidence: https://gitlab.windenergy.dtu.dk/fair-data/winddata-revamp/winddata-documentation/-/blob/master/norre_m2.md
    found: 2026-11-06
notes: >-
  Early 1990s research measurements from a Risø (now DTU Wind Energy) wake and loads programme:
  10-minute active power, nacelle wind speed and yaw position for each turbine, with two 58 m met
  masts. Two files: norre_m2_all.nc (151 MB, all records) and norre_m2_concurent.nc (12 MB, times
  when all signals are present). Checked by downloading the concurrent file: 8,703 records from
  1992-03-02 to 1993-06-24, 40 per-turbine power series in kW measured by DEIF watt converters,
  whose values differ between turbines; most steps are 10 minutes, with gaps. The full file was
  not downloaded. Turbine model, rating (330 kW per the site page) and local x-y positions are
  in the site documentation, not the data files. Useful for long-range checks of old reanalysis
  periods or for wake studies, not for current fleet output. The time zone is not stated in the
  files.
