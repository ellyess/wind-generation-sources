conventions:
  timezone: unknown
  timestamp: unknown
  unit: unknown
  value: period-mean
  evidence: "https://zenodo.org/records/7342466"
  note: >-
    The archive's ReadMe.xlsx lists active_power for turbines 1 to 7 with average, minimum,
    maximum, standard deviation and count "over the 1-min period" (columns active_power_1_avg
    and so on), and describes the time column only as "Timestamp" (for example 2020-02-17
    16:30:00, no zone). Neither the ReadMe nor the CSV header gives a unit for active power;
    values near 2,000 for 2.05 MW turbines read as kW, but the unit is recorded as unknown until
    stated. Read 2026-11-06 by an automated research pass; not yet reviewed. Checked again
    2026-11-07: the Zenodo description, the ReadMe and the Simley et al. (2021) paper state no
    time zone, so timezone stays unknown. The data rule out French local time: the SCADA,
    control log and WindCube files each hold all 60 minutes from 02:00 to 02:59 on 29 March
    2020, an hour French clocks skipped, with no repeated stamps. UTC and fixed UTC+01:00 both
    fit (see the trap).
