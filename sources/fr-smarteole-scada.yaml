traps:
  - summary: Every minute when any turbine was stopped has been removed.
    detail: >-
      The data were pre-processed for a wake-steering study: timesteps with at least one turbine
      stopped were dropped and nacelle direction signals were corrected. The series is therefore
      not a complete record of the farm's output and cannot give energy totals or availability.
    evidence: https://zenodo.org/records/7342466
    found: 2026-11-06
  - summary: Turbine SMV6 was deliberately yawed off the wind for part of the period.
    detail: >-
      Wake steering was applied on SMV6 and toggled during the campaign; the applied yaw offset
      is in the control log file. Its output, and that of the turbines downstream, reflects the
      experiment and not normal operation.
    evidence: https://wes.copernicus.org/articles/6/1427/2021/wes-6-1427-2021.html
    found: 2026-11-06
tools:
  - name: wind-up
    url: https://github.com/resgroup/wind-up
    language: Python
notes: >-
  One-minute averaged SCADA (supervisory control and data acquisition) data for seven Senvion
  MM82 turbines (2.05 MW each) during a three-month wind farm control field test, with min, max,
  standard deviation and sample count per minute, a ground-based lidar, the control log, and
  turbine coordinates in WGS84 and Lambert 93. Useful for wake and power-curve work, not for
  long-run generation statistics. Checked by downloading the archive: per-turbine active power
  columns are present and differ between turbines. The time zone of the timestamps is not
  stated in the CSV header.
