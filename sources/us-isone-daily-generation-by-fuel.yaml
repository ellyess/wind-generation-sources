traps:
  - summary: ISO-NE's five-minute "Dispatch Fuel Mix" sounds like observed output but is a dispatch-software forecast.
    detail: >-
      The ISO Express page describes it as the electricity "expected to be produced" by fuel type,
      "as forecasted by the ISO's dispatch software". Only the Daily Generation by Fuel Type report
      is metered.
    evidence: https://www.iso-ne.com/isoexpress/web/reports/operations/-/tree/gen-fuel-mix
    found: 2026-11-06
  - summary: Fuel types are as registered, and before 2019 the workbook had separate pre- and post-2014 fuel tabs.
    detail: >-
      Since December 2014 dual-fuel units can declare blends, and ISO-NE applies them to metered
      output. From 2019 the workbook only has the post-2014 fuel split. Wind is not affected by
      blending but the tab layout changes between years.
    evidence: https://www.iso-ne.com/static-assets/documents/2022/01/2022_daygenbyfuel.xlsx
    found: 2026-11-06
  - summary: The download page asks for a captcha, though the yearly workbooks also have direct links.
    detail: >-
      Workbooks sit at /static-assets/documents/<year>/<month>/<year>_daygenbyfuel.xlsx; the month
      in the path varies, so find each link on the page.
    evidence: https://www.iso-ne.com/isoexpress/web/reports/operations/-/tree/daily-gen-fuel-type
    found: 2026-11-06
  - summary: The README tab says the values are MWh "during the week", but each row is one day's total.
    detail: >-
      The README in the 2022 workbook reads "The data represent, in megawatt-hours (MWh), the
      amount of electricity assigned to each fuel type during the week", a sentence carried
      over from the Weekly Market Performance Report it mentions. The DAYGENBYFUEL tab has 365
      rows, one per DATE from 1 January to 31 December 2022, and the values change daily (WIND
      4,240.307 MWh on 1 January). Read each row as that day's total; do not divide by seven.
      Found by an automated research pass on 2026-11-07; not yet reviewed by a person.
    evidence: https://www.iso-ne.com/static-assets/documents/2022/01/2022_daygenbyfuel.xlsx
    found: 2026-11-07
notes: >-
  Daily metered MWh by fuel, including a WIND column, for the whole New England system. The page
  says the report runs from 1 January 2008; workbooks for 2020, 2022 and 2023 were opened at the
  check. No per-plant output is published. ISO-NE's web services (webservices.iso-ne.com)
  returned 401 without an ISO Express account and were not checked further. Whether offshore
  wind is in the WIND column was not checked.
status: active
