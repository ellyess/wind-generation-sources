id: fr-rte-eco2mix-national
name: éCO2mix national consolidated and definitive data (Données éCO2mix nationales consolidées et définitives)
publisher: RTE (Réseau de Transport d'Électricité), via the ODRE open data portal
publisher_role: tso
countries: [FR]
level: country
technology: onshore-and-offshore-combined
measure: reported-generation
resolution: 30min
coverage:
  start: 2012
  update: daily refresh; consolidated in the middle of the following month, definitive in the second half of the following year
capacity: separate-dataset
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: UTC
  timestamp: unknown
  unit: MW
  value: unknown
  evidence: "https://odre.opendatasoft.com/explore/dataset/eco2mix-national-cons-def/"
  note: >-
    The API's date_heure field comes back with +00:00, while the date and heure fields give
    French local time; the wind field is labelled "Eolien (MW)". The description says production
    is given at the half-hour step, and rows come every quarter-hour with wind empty at :15 and
    :45. The local-to-UTC conversion breaks on clock-change days: 27 October 2024 has 96
    quarter-hour rows, so 00:00 to 00:45 UTC has no rows, and on 31 March 2024 the local 02:00
    to 02:45 rows share UTC stamps with 03:00 to 03:45. Whether a value is a mean or a snapshot,
    and whether the stamp opens or closes the period, are not stated. Read 2026-11-06 by an
    automated research pass; not yet reviewed.
access:
  method: api
  url: https://odre.opendatasoft.com/explore/dataset/eco2mix-national-cons-def/
  key_required: false
  registration: false
  formats: [csv, json, parquet, xlsx]
  languages: [fr]
licence:
  name: Licence Ouverte v2.0 (Etalab)
  spdx: etalab-2.0
  url: "https://odre.opendatasoft.com/explore/dataset/eco2mix-national-cons-def/"
  redistribution: allowed-with-attribution
  attribution: RTE, via ODRE (Open Data Réseaux Énergies)
  verified: true
  note: Licence named in the dataset metadata; the capacity dataset parc-prod-par-filiere carries the same licence.
traps:
  - summary: The single wind column ("eolien") holds onshore and offshore together, with no split.
    evidence: https://odre.opendatasoft.com/explore/dataset/eco2mix-national-cons-def/
    found: 2026-11-06
  - summary: Clock-change hours are in local time and cannot be placed exactly in UTC.
    detail: >-
      PyVWF leaves three hours of each year's two clock-change days empty, because the series
      cannot place them.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/guides/data-sources.md
  - summary: The UTC date_heure field is wrong on both clock-change days, with a missing hour in October and a copied one in March.
    detail: >-
      Both days have 96 quarter-hour rows. On 31 March 2024 the rows for local 02:00 to 02:45,
      an hour that did not exist, are present and copy the 03:00 to 03:45 rows, UTC stamp
      included: "2024-03-31T01:00:00+00:00 02:00 8183" and "2024-03-31T01:00:00+00:00 03:00
      8183" (date_heure, heure, eolien). On 27 October 2024 local 02:00 appears once, so
      "2024-10-26T23:45:00+00:00 01:45" is followed by "2024-10-27T01:00:00+00:00 02:00" and
      00:00 to 00:45 UTC have no rows. 30 March and 26 October 2025 show the same pattern. Drop
      the duplicated March hour, and treat the October UTC hour as missing rather than
      interpolating across it. Found by an automated research pass on 2026-11-07; not yet
      reviewed by a person.
    evidence: https://odre.opendatasoft.com/api/explore/v2.1/catalog/datasets/eco2mix-national-cons-def/records?select=date_heure,date,heure,eolien&where=date%3D%272024-03-31%27&order_by=heure&limit=100
    found: 2026-11-07
  - summary: Installed capacity is a separate dataset (parc-prod-par-filiere), given at year end.
    detail: Interpolate through the year, or the year's growth is assigned to the wrong months.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/guides/data-sources.md
  - summary: The same definitive series downloaded from RTE's own eCO2mix site comes under RTE's terms, which forbid redistributing the files; only this copy on ODRE is under Licence Ouverte.
    detail: >-
      PyVWF first built France's observations from RTE's annual definitive eCO2mix files, whose
      terms allow reuse with credit but forbid redistribution, and switched to this dataset on
      2026-10-25 for that reason. Hour by hour the two agreed, except 2021-12-31 23:00 UTC
      (3,187.5 MW here against 3,182.0 MW) and the March clock-change hour, which RTE's files
      write once and this copy twice. RTE's terms page was not re-read for this trap. Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/scripts/region_tools/build_fr_obs_from_rte.py#L23-L24
    found: 2026-10-25
notes: >-
  The complete French national series, offshore included in every month. ENTSO-E's French
  per-type data lacks offshore before June 2023 (see eu-entsoe-actual-generation). First record
  31 December 2011, 23:00 UTC, which is midnight on 1 January 2012 in Paris. Added 2026-11-08:
  coverage.update was missing. The dataset description says it is "rafraîchi une fois par jour",
  consolidated data arrive "en milieu de M+1" and definitive data "deuxième semestre A+1"
  (definitive January 2012 to December 2024, consolidated from January 2021), and that values
  are "élaborées à partir des comptages et complétées par des forfaits" (meter readings completed
  with flat-rate estimates). The last wind value on 2026-11-08 was 2026-08-31 21:30 UTC.
status: active
last_checked: 2026-11-08
checked_by: Ellyess Benmoufok and Claude Code; dataset metadata read via the Opendatasoft API; licence read on the publisher's page 2026-11-06; links and conventions re-checked by an automated pass 2026-11-08
