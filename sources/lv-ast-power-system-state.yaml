  note: >-
    The page labels the production chart in MW and warns that its data are 'not completely accurate
    and instantaneous'. The JSON behind the chart gives epoch milliseconds, which are UTC by
    definition; for 26 October 2025 the 24 stamps start at 2025-10-25T21:00Z (local midnight, UTC+3)
    in even hourly steps, so the repeated autumn hour is absent (see trap). AST does not say whether
    a value is an hourly average or a reading, or which end of the hour the stamp marks. The XLS and
    CSV exports were not checked. Read 2026-11-06 by an automated research pass; not yet reviewed.
    Corrected 2026-11-08: the repeated autumn hour is present (on 26 October 2025 both
    00:00Z and 01:00Z carry values); what is lost is the last hour of the requested range, so
    the stamps themselves are UTC and correct (see trap).
