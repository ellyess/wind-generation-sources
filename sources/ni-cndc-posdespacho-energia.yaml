id: ni-cndc-posdespacho-energia
name: Postdespacho de Energía (daily post-dispatch energy by generating unit), MEMN Diarios
publisher: Centro Nacional de Despacho de Carga (CNDC), Empresa Nacional de Transmisión Eléctrica (ENATREL)
publisher_role: tso
countries: [NI]
level: farm
technology: onshore
measure: reported-generation
resolution: hourly
coverage:
  start: 2009
  update: through the day; the current day is returned while still incomplete
capacity: none
coordinates: separate-dataset
curtailment: unknown
conventions:
  timezone: unknown
  timestamp: unknown
  unit: MWh
  value: period-total
  evidence: https://www.cndc.org.ni/MEMNDiarios
  note: >-
    The MEMN Diarios page titles the table 'Postdespacho de Energía (MWh)' (beside 'Predespacho de
    Energía (MWh)'), and the JSON gives one value per unit per hour, labelled '00' to '23' in
    fecha_hora. No time zone is stated, nor which end of the hour a label marks. Read 2026-11-06 by
    an automated research pass; not yet reviewed. A hint, not a publisher statement: requested at
    03:28 and 03:30 UTC on 2026-11-08 (21:28 to 21:30 in Managua, UTC-6), the day 7 November 2026
    already had hour "21" with a full-looking demand value (685.988 MWh, against 720.77 for "20"),
    unchanged two minutes later. If the clock is Managua time, that fits labels marking the end
    of the hour (or a value that is not yet metered) better than the start. Observed 2026-11-08
    by an automated research pass; not yet reviewed.
