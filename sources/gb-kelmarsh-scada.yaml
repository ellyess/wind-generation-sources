conventions:
  timezone: UTC
  timestamp: unknown
  unit: kW
  value: unknown
  evidence: "https://zenodo.org/records/16807551"
  note: >-
    Each Greenbyte file header states "Time zone: UTC" (checked in the 2016 turbine file and the
    grid meter file). The turbine column "Power (kW)" sits beside "Power, Standard deviation",
    minimum and maximum columns, which implies a 10-minute mean but is not stated, and the
    header does not say whether "Date and time" opens or closes the interval. "Energy Export
    (kWh)" is also given. Kelmarsh_WT_dataSignalMapping.csv lists "Power" with unit kWh, which
    contradicts the kW column header. Read 2026-11-06 by an automated research pass; not yet
    reviewed. Checked 2026-11-07 against the 2016 file for turbine 1: the values are kW, not
    kWh (see the trap), and Power/6 summed over the year (4,211 MWh) matches the summed Energy
    Export (4,240 MWh), as a 10-minute mean would; the mean is still not stated by the publisher.
