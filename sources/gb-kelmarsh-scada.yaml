traps:
  - summary: The record most often linked (Zenodo 5841834) is an old version that stops in mid-2021.
    detail: >-
      Zenodo keeps every version under its own id. 5841834 is version 0.0.3 (February 2022) with
      SCADA to mid-2021. The latest version (16807551, August 2025) adds 2021 to 2024 files. Use the
      concept DOI 10.5281/zenodo.5841833, which always resolves to the latest version, and record
      which version you used.
    evidence: https://zenodo.org/records/5841834
    found: 2026-11-06
  - summary: The column header row starts with a '#', like the comment lines above it.
    detail: >-
      Each turbine CSV opens with nine '#' comment lines, then a header line that also begins
      '# Date and time'. Reading with a comment character set drops the header along with the
      comments. Skip the first nine lines instead. Missing or erroneous values are written as NaN.
    evidence: https://zenodo.org/records/16807551
    found: 2026-11-06
  - summary: The 2016 turbine files start on 3 January although their header says 1 January.
    detail: >-
      The Greenbyte export header gives the interval as 2016-01-01 to 2017-01-01, but the first
      row is 2016-01-03 00:00, as the file name says. Early rows hold NaN for most signals.
    evidence: https://zenodo.org/records/16807551
    found: 2026-11-06
  - summary: The fiscal grid meter file ends at the start of 2023.
    detail: >-
      Kelmarsh_Grid_Meter_4458.zip covers 2016-01-01 to 2023-01-01. The 2023 and 2024 additions
      are turbine SCADA and substation (PMU) data only, so metered farm export cannot be checked
      against turbine output for those years.
    evidence: https://zenodo.org/records/16807551
    found: 2026-11-06
