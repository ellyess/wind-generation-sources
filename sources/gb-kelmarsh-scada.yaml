notes: >-
  Ten-minute SCADA (supervisory control and data acquisition) statistics for six Senvion MM92
  turbines, 2.05 MW each, exported from the operator's Greenbyte system: active power, energy
  export, wind speed, direction, status logs and lost-production estimates split by downtime and
  curtailment, plus site substation and fiscal grid meter data. A static CSV gives each turbine's
  latitude, longitude, rated power, hub height and rotor diameter. Turbine power is the operator's
  SCADA reading, not settlement metering; the grid meter file is the metered check. All
  timestamps are UTC per the file headers. Checked by downloading the 2016 SCADA archive and
  comparing two turbines: their power values differ, as they should. Signals are not all present
  for the whole period.
