traps:
  - summary: The record most often linked (Zenodo 5841834) is an old version that stops in mid-2021.
    detail: >-
      Zenodo keeps every version under its own id. 5841834 is version 0.0.3 (February 2022) with
      SCADA to mid-2021. The latest version (16807551, August 2025) adds 2021 to 2024 files. Use the
      concept DOI 10.5281/zenodo.5841833, which always resolves to the latest version, and record
      which version you used.
    evidence: https://zenodo.org/records/5841834
    found: 2026-11-06
  - summary: A published audit reports that the 2023 and 2024 turbine files of version 4 repeat each year as 81 cumulative blocks.
    detail: >-
      Only the first occurrence of each timestamp holds measured values, so de-duplicating with
      keep-last throws away nearly all the data; keep the first. The audit's deposit has
      reconstructed files with one row per 10-minute interval and a per-interval flag table.
      Not yet confirmed here against the v4 files themselves.
    evidence: https://doi.org/10.5281/zenodo.23171808
    found: 2026-11-06
  - summary: The column header row starts with a '#', like the comment lines above it.
    detail: >-
      Each turbine CSV opens with nine '#' comment lines, then a header line that also begins
      '# Date and time'. Reading with a comment character set drops the header along with the
      comments. Skip the first nine lines instead. Missing or erroneous values are written as NaN.
    evidence: https://zenodo.org/records/16807551
    found: 2026-11-06
  - summary: The 2016 turbine files start on 3 January although their header says 1 January.
    detail: >-
      The Greenbyte export header gives the interval as 2016-01-01 to 2017-01-01, but the first
      row is 2016-01-03 00:00, as the file name says. Early rows hold NaN for most signals.
    evidence: https://zenodo.org/records/16807551
    found: 2026-11-06
  - summary: The fiscal grid meter file ends at the start of 2023.
    detail: >-
      Kelmarsh_Grid_Meter_4458.zip covers 2016-01-01 to 2023-01-01. The 2023 and 2024 additions
      are turbine SCADA and substation (PMU) data only, so metered farm export cannot be checked
      against turbine output for those years.
    evidence: https://zenodo.org/records/16807551
    found: 2026-11-06
  - summary: The signal-mapping file gives turbine "Power" in kWh, but the values are kW.
    detail: >-
      Kelmarsh_WT_dataSignalMapping.csv has the row "5,Power,Actual value of active power,kWh",
      while the turbine files head the column "Power (kW)". The kW header is right: in the 2016
      file for turbine 1 (Turbine_Data_Kelmarsh_1_2016-01-03_-_2017-01-01_228.csv) Power peaks at
      2,072 kW against the 2.05 MW rating, and at 2016-06-01 12:00 it reads 1858.8 beside an Energy
      Export (kWh) of 356, about a sixth of it, as a 10-minute energy should be. Read Power as kW;
      a row's energy in kWh is Power times 10/60. Found by an automated research pass on
      2026-11-07; not yet reviewed by a person.
    evidence: https://zenodo.org/records/16807551/files/Kelmarsh_WT_dataSignalMapping.csv
    found: 2026-11-07
