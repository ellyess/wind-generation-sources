id: cn-sdwpf-longyuan-134-turbine-scada
name: "SDWPF: A Dataset for Spatial Dynamic Wind Power Forecasting over a Large Turbine Array"
publisher: Baidu Research, with data from China Longyuan Power Group Corp. Ltd.
publisher_role: research
countries: [CN]
area: >-
  One unnamed onshore wind farm of China Longyuan Power Group. China is inferred from the
  operator and the UTC+08:00 time zone; the publisher never names the country.
level: turbine
technology: onshore
measure: reported-generation
resolution: 10min
coverage:
  start: 2020
  end: 2021
  update: none (static release; figshare version 2, published 2024-04-30)
capacity: none
coordinates: none
curtailment: not-reported
conventions:
  timezone: UTC+08:00
  timestamp: unknown
  unit: kW
  value: period-mean
  evidence: https://zhoujingbo.github.io/paper/2024SDWPFScientificData.pdf
  note: >-
    Table 2 of the paper describes Tmstamp as "Created time of the record" with the note "Time
    zone UTC + 08:00", and Patv (kW) as active power; the Data Records section says each
    10-minute record "represents average values over each 10-minute interval, derived from
    high-frequency (1 Hz) sampling". Whether a stamp starts or ends its interval is not stated.
    Onshore is inferred from the turbine elevations (about 1,430 m above sea level in
    sdwpf_turb_location_elevation.csv), not stated.
