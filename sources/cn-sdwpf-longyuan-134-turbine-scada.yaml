traps:
  - summary: >-
      The publisher never says where the farm is, not even the country; turbine positions are
      relative only.
    detail: >-
      The paper and README name the data provider (China Longyuan Power Group) but not the farm's
      country, region or name, and sdwpf_turb_location_elevation.csv gives x and y in metres from
      an arbitrary origin, so the data cannot be matched to reanalysis grid cells without an
      outside guess. The time zone UTC+08:00 narrows it but does not fix it, and this catalogue's
      country tag, China, is an inference from the operator and the time zone. Found by an automated
      research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://ndownloader.figshare.com/files/46005798
    found: 2026-11-08
  - summary: The weather columns are ERA5, not measurements.
    detail: >-
      T2m, Sp, RelH, Wspd_w, Wdir_w and Tp in the full file are taken from ERA5 (Table 2), so do
      not use them as observations when validating a reanalysis. Found by an automated research
      pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://zhoujingbo.github.io/paper/2024SDWPFScientificData.pdf
    found: 2026-11-08
notes: >-
  Two years (January 2020 to December 2021) of 10-minute SCADA from 134 turbines in one farm,
  11,361,191 records, with active and reactive power (kW), nacelle wind speed and direction,
  pitch angles and temperatures. sdwpf_2001_2112_full.csv is 1.7 GB (the parquet copy 292 MB);
  the 245-day KDD Cup 2022 file (334 MB) withholds dates (the README says timestamps were held
  back during the challenge). The turbines are Sinovel SL1500/82 (82 m rotor, 70 m hub); rated
  power is in the paper's supplement, which was not read.
status: fixed-release
