  note: >-
    The column definitions on the dataset page give columns 1 to 24 as generation per time band
    (시간대별 발전량) in kWh, and the description says the bands run from 01시 to 24시 in one-hour steps; the
    daily total, mean, maximum and minimum are also kWh. The page does not say whether band 1 is the
