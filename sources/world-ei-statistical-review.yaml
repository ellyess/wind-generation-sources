  note: >-
    The site terms say copies of documents on the EI's sites may be made "for information
    purposes and solely for the private use" of users, and that any other use or reproduction is
    forbidden without the EI's written permission. No separate licence for the Statistical Review
    data was found on the download page or in the 2025 workbook. The current edition's download
    form (email address and reCAPTCHA) may present further terms; it was not submitted. Other
    aggregators (Ember, Our World in Data) republish EI figures; their basis for doing so was not
    checked. Changed 2026-11-07 from "prohibited" to "unclear" by the maintainer: the terms
    found are site-wide, not specific to the dataset, so they do not settle whether the data may
    be re-hosted. Until the EI says otherwise, link to its download page rather than re-hosting.
traps:
  - summary: The current edition's files sit behind an email form with a reCAPTCHA; only archived editions download directly.
    detail: >-
      On the check date the 2026 data buttons opened a form asking for an email address with a
      reCAPTCHA. The 2023, 2024 and 2025 workbooks were plain links. The archive note says
      historical data are revised between editions, so an archived workbook is not the latest
      history.
    evidence: https://www.energyinst.org/statistical-review/resources-and-data-downloads
    found: 2026-11-06
  - summary: Only about 75 countries are named; smaller producers exist only inside regional "Other" rows.
    detail: >-
      For a country not named in the sheet (for example most of Africa and Central America),
      the Statistical Review has no country figure at all. Use IRENA, EIA or UNSD for those.
    evidence: https://www.energyinst.org/__data/assets/excel_doc/0008/1656215/EI-Stats-Review-ALL-data.xlsx
    found: 2026-11-06
notes: >-
  Annual wind generation in terawatt-hours by country. The sheet's columns start in 1965, but the
  first non-zero value is Denmark in 1978, so coverage is given from 1978. The series is in the "Wind Generation - TWh" sheet of the all-data workbook, with wind
  installed capacity in a separate sheet. The sheet's footnote says figures are "based on gross
  generation and not accounting for cross-border electricity supply". The page also offers a
  consolidated narrow-format CSV of all series. Checked by reading the 2025 edition workbook (data
  to 2024) on the check date; the 2026 edition was not downloaded because of the email form. The
  Statistical Review was published by BP until 2022 and by the Energy Institute since 2023.
status: restricted
