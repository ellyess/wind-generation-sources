area: >-
  The 2025 edition's wind generation sheet names 79 countries; the 74 listed in countries had a
  non-zero value. Every other country is folded into regional "Other" rows (Other Europe, Other
  Asia Pacific, Eastern Africa and so on), with world, OECD, non-OECD and EU totals.
