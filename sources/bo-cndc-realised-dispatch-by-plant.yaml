traps:
  - summary: The hourly values are instantaneous MW read from SCADA on the hour, not hourly energy.
    detail: >-
      The sheet footnote says the power values are instantaneous records at each full hour taken
      from the SCADA system. Summing the 24 values only approximates daily energy, and short wind
      fluctuations within the hour are not captured.
    evidence: https://www.cndc.bo/wp-content/uploads/mem/estadisticas/diaria/2026/11/dcdr_051126.xlsx
    found: 2026-11-06
  - summary: The TOTAL column is not the sum of the 24 hourly values and has no stated unit.
    detail: >-
      For 5 November 2026 the 24 values sum to 38.39 (Qollpana I), 162.08 (Qollpana II), 77.78
      (Warnes), 84.57 (San Julián) and 186.60 (El Dorado), while the TOTAL column shows 37.5, 152,
      74.2, 90.4 and 174.4. It is probably daily energy from another source, but the sheet does not
      say so. Do not treat the two as interchangeable.
    evidence: https://www.cndc.bo/wp-content/uploads/mem/estadisticas/diaria/2026/11/dcdr_051126.xlsx
    found: 2026-11-06
  - summary: File format and plant split change over time; 2016 has one Qollpana row and older years come as zipped .xls.
    detail: >-
      The 1 January 2016 file has a single "QOLLPANA" row; the 15 March 2020 file has Qollpana I and
      Qollpana II only; Warnes, San Julián and El Dorado appear in 2026. Files up to 2025 are zips
      holding .xls workbooks, while 2026 files are plain .xlsx under a year and month folder. Use
      the listing service rather than guessing file paths. Corrected 2026-11-08: this trap said
      Warnes, San Julián and El Dorado appear in 2026. They first appear between 1 September 2021
      (rows QOLLPANA I and QOLLPANA II only) and 1 October 2021 (all five wind rows), and are
      present in the 31 December 2021 and 2022 files. The ".xls" files inside the zips for 2016,
      2021 and 2022 are in fact Excel 2007+ (xlsx) workbooks: xlrd rejects them and openpyxl reads
      them, so pass engine="openpyxl" despite the extension.
    evidence: https://www.cndc.bo/wp-content/uploads/mem/estadisticas/diaria/2016/dcdr_010116.zip
    found: 2026-11-06
notes: >-
  The CNDC statistics page lists daily files under "Diaria", category "Despacho de Carga DC
  Realizado". A public WordPress JSON service returns the file list for a year
  (/wp-json/cndc/v1/estadisticas/documentos?categoria_id=270&agrupado=true&anio=YYYY); it returned
  366 daily files for 2016 and none for 2015. Each workbook has a "POST" sheet titled "DESPACHO DE
  CARGA REALIZADO (MW)" with one row per generating plant, hours 01:00 to 24:00, a TOTAL column and
  a "SUBTOTAL EOLICO" row. The 5 November 2026 file has five wind rows with distinct hourly
  profiles, so the values are per plant. No per-plant capacity or location is published with these
  files; national effective wind capacity appears only on the CNDC dashboard.
