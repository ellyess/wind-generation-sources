traps:
  - summary: The monthly file name changes with each release, so a pinned link goes stale.
    detail: >-
      On 2026-11-06 the file was Electricity_Generation_M_Aug26_061126.xlsx (data to August 2026,
      released 6 November 2026). Take the current link from the subject page.
    evidence: https://statsmauritius.govmu.org/Documents/Statistics/By_Subject/Energy_Water/Electricity/Electricity_Generation_M_Aug26_061126.xlsx
    found: 2026-11-06
  - summary: The sheet is laid out with months as columns, and percentage changes sit in the same rows.
    detail: >-
      One sheet, one row per source, one column per month from January 2013; after the last
      month the rows carry change figures (for example -0.97 for wind) rather than kWh. Recent
      months are revised (a note says April to October 2025 were revised), so re-download rather
      than append.
    evidence: https://statsmauritius.govmu.org/Documents/Statistics/By_Subject/Energy_Water/Electricity/Electricity_Generation_M_Aug26_061126.xlsx
    found: 2026-11-06
notes: >-
  National monthly wind generation in kWh from January 2013. The annual Digest of Energy and Water
  Statistics (Digest_Energy_Yr25_011026.xlsx on the same page) splits wind by island from 2010 in
  table 16: Island of Mauritius wind comes from independent power producers (9.82 GWh in 2025) and
  Rodrigues wind from the Central Electricity Board (1.40 GWh in 2025); table 15 gives plant
  capacity, with one wind farm on Mauritius in 2025 (EOLE Plaine des Roches, 9.35 MW) and 1.22 MW
  on Rodrigues. Wind is a very small fleet (about 0.3% of generation), so useful mainly as a
  small-island case.
