  note: >-
    Values labelled by year ("Anul 2024"). The matrix's unit dimension is "UM: Milioane kWh"
    (million kilowatt-hours), which is GWh. The definition says production is the electricity
    obtained in thermal, hydro and nuclear plants and from other sources; it does not say
    whether the figures are gross or net. Read 2026-11-08 by an automated research pass; not
    yet reviewed.
