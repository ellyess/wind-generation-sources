traps:
  - summary: Wind is simply absent before 2007; the query returns no rows for those years rather than zeros.
    detail: >-
      A pivot query for "Eoliana" over every year in the matrix (1992 to 2024) returned 18 rows,
      2007 (3 GWh) to 2024 (6,350 GWh). Treat earlier years as not reported. Found by an
      automated research pass on 2026-11-08; not yet reviewed by a person.
    evidence: http://statistici.insse.ro:8077/tempo-ins/matrix/IND118A
    found: 2026-11-08
  - summary: Values are whole GWh, and the service is plain HTTP on port 8077.
    detail: >-
      Every wind value came back as an integer number of million kWh (for example 6,997 in 2022
      and 7,547 in 2023). The TEMPO application and its JSON API are served over http:// on port
      8077, which some networks block. Found by an automated research pass on 2026-11-08; not
      yet reviewed by a person.
    evidence: http://statistici.insse.ro:8077/tempo-ins/matrix/IND118A
    found: 2026-11-08
notes: >-
  Annual electricity production in Romania by category of power plant: total, thermal, hydro,
  wind ("Eoliana"), solar and nuclear. TEMPO-Online's matrix endpoint
  (tempo-ins/matrix/IND118A) describes the dimensions and their nomItemId codes; data come from
  a POST to tempo-ins/pivot with an encQuery of codes per dimension (wind is 26255, the unit
  9654), which returns comma-separated text. Checked 2026-11-08: wind 306 GWh in 2010, 6,201 in
  2014, 7,547 in 2023 and 6,350 in 2024. Sources named on the matrix are INS surveys of the
  energy balance and of electricity and heat production. For hourly national wind see
  ro-transelectrica-sen-production. The regulator ANRE (anre.ro) could not be checked: on
  2026-11-08 both https://www.anre.ro/ and https://anre.ro/ failed with an expired TLS
  certificate.
status: active
