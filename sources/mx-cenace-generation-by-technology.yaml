traps:
  - summary: Each month can be republished under several settlement runs, so the same hour has more than one value over time.
    detail: >-
      Files are listed by operating month and settlement number ("No. de Liquidación"); the
      September 2026 file is the original run, L0. Record which run you used, and prefer the
      latest.
    evidence: https://www.cenace.gob.mx/Paginas/SIM/Reportes/EnergiaGeneradaTipoTec.aspx
    found: 2026-11-06
  - summary: The page says the statistics combine historical and forecast values, without saying which hours are which.
    detail: >-
      The description reads that the report "integra los valores históricos y pronosticados".
      The column title says settled (liquidada) energy, which suggests metered values, but the
      mix is not documented.
    evidence: https://www.cenace.gob.mx/Paginas/SIM/Reportes/EnergiaGeneradaTipoTec.aspx
    found: 2026-11-06
  - summary: Downloads sit behind a form with a month picker, so there is no stable file link.
    detail: >-
      The CSV is returned by an ASP.NET form post for the chosen month; scripts must replay the
      form, or use the zip download for a date range.
    evidence: https://www.cenace.gob.mx/Paginas/SIM/Reportes/EnergiaGeneradaTipoTec.aspx
    found: 2026-11-06
notes: >-
  Hourly settled generation in MWh for the whole Mexican system by technology, with an "Eolica"
  (wind) column, published per operating month. The September 2026 file was downloaded and read
  (720 hourly rows, one system, wind between about 2,200 and 3,100 MWh in the first hours). The
  page's month picker starts at April 2016; that start is as set by the publisher and was not
  downloaded. No per-plant output is published openly.
status: active
