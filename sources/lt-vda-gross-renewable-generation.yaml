traps:
  - summary: Years before wind existed are "NaN" with a status code, not zero or absent.
    detail: >-
      Wind (code 06V) has ObsValue "NaN" with OBS_STATUS "nebuvo" ("category not applicable")
      for 1990 to 2003; the first value is 1.2 GWh in 2004. The latest year carries
      "isankstiniai" (provisional data): 4,214.3 GWh for 2025. Read the status before using the
      last year. Found by an automated research pass on 2026-11-08; not yet reviewed by a
      person.
    evidence: https://osp-rs.stat.gov.lt/rest_xml/data/S1R094_M8020313
    found: 2026-11-08
  - summary: A series-key filter in the URL returns an empty message instead of the wind series.
    detail: >-
      On 2026-11-08 /rest_xml/data/S1R094_M8020313/06V.GWh returned HTTP 200 with a header and
      no observations, while the unfiltered request returned every installation type. Fetch
      the whole table (about 350 kB) and filter on elektros_irenginiai = 06V. Found by an
      automated research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://osp-rs.stat.gov.lt/rest_xml/data/S1R094_M8020313/06V.GWh
    found: 2026-11-08
notes: >-
  Annual gross electricity production from renewables for Lithuania, by installation type
  (hydro by size class, wind, solar photovoltaic, solid biofuels, biogases, waste, geothermal,
  total), 1990 to 2025, from the official statistics portal's keyless SDMX 2.1 service (the
  /rest_xml/ and /rest_json/ paths redirect to /ords/ipospp/ospp/...). Checked 2026-11-08: wind
  rises from 1.2 GWh (2004) and 106.1 GWh (2007) to 1,512.4 (2022), 2,536.1 (2023), 3,448.2
  (2024) and 4,214.3 GWh (2025, provisional). The message header names the sender "Lietuvos
  statistikos departamentas". For hourly national wind from 2023 see lt-litgrid-open-data-wind.
status: active
last_checked: 2026-11-08
