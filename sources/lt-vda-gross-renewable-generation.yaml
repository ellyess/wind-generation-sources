  note: >-
    On 2026-11-08 every page tried on osp.stat.gov.lt, including the portal home, the indicator
    page and candidate terms-of-use pages, returned HTTP 403 to a plain request, and
    www.stat.gov.lt redirected to vda.lrv.lt, which also returned 403. Only the SDMX service
