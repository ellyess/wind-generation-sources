id: us-caiso-renewables-outlook
name: Today's Outlook renewables history, and Production and Curtailments Data
publisher: California Independent System Operator (CAISO)
publisher_role: iso-rto
countries: [US]
area: CAISO balancing area (most of California)
level: zone
technology: onshore
measure: reported-generation
resolution: 5min
coverage:
  start: 2014
  update: daily (Today's Outlook history)
capacity: none
coordinates: not-applicable
curtailment: reported
conventions:
  timezone: America/Los_Angeles
  timestamp: unknown
  unit: MW
  value: period-mean
  evidence: https://www.caiso.com/todays-outlook/supply
  note: >-
    Today's Outlook describes the renewables trend as "Power separated by renewable resource, on a
    5-minute average" and labels its times PT. The daily renewables.csv has only a clock "Time"
    column (00:00, 00:05, ...) with no offset and no statement of whether a time starts or ends its
    interval. The 2014-2025 workbook read-me says "All data is in megawatt (MW) units"; its Hour
    column is 1+HOUR(Date) and Interval 1+MINUTE(Date)/5, so a 00:00 row is interval 1 of
    hour-ending 1, which reads as interval start, though this is not stated in words. Read
    2026-11-06 by an automated research pass; not yet reviewed.
access:
