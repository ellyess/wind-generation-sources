  docs: https://www.caiso.com/library/production-curtailments-data
  key_required: false
  registration: false
  formats: [csv, xlsx]
  languages: [en]
licence:
  name: California ISO website Terms of Use (last updated 2 October 2018)
  url: "https://www.caiso.com/privacy-terms-of-use"
  redistribution: allowed-with-attribution
  attribution: Credit the California ISO and keep its copyright notices intact
  verified: true
  note: >-
    The terms forbid copying or redistributing site material except as they authorise, then
    authorise use of the mostly public-record material provided copyright notices are kept and
    the California ISO is credited. Read as reuse with credit; check with CAISO before
    large-scale re-hosting.
traps:
  - summary: The five-minute production and curtailment workbooks are discontinued; the last ones end on 31 December 2025.
    detail: >-
      CAISO no longer publishes the yearly Production and Curtailments Data workbook. Curtailment
      after that is only in the daily renewables reports, and production only in Today's Outlook.
      Corrected 2026-11-08: this trap said the workbooks stopped on 1 June 2025 and covered May
      2014 to May 2025. The library page does say "As of 6/1/2025 the ISO is no longer publishing
      this report", but it lists production-and-curtailments-data-2025.xlsx (posted 2026-01-07),
      whose Production sheet has all 105,120 five-minute rows of 2025, to 2025-12-31 23:55, and
      production-and-curtailments-data-june-december-2025.xlsx (posted 2026-02-13), a curtailment
      sheet to 31 December 2025 marked "a one time bulk upload". The 2025 workbook's own
      curtailment sheet ends on 31 May 2025.
    evidence: https://www.caiso.com/library/production-curtailments-data
    found: 2026-11-06
  - summary: The workbook says its data are raw and not of operational or settlement quality.
    detail: >-
      Its read-me also warns that five-minute values may not match the hourly figures in the
      daily reports. Curtailed energy is not counted in the production columns.
    evidence: https://www.caiso.com/documents/production-and-curtailments-data-2024.xlsx
    found: 2026-11-06
  - summary: Today's Outlook daily files only go back to 10 April 2018.
    detail: >-
      /outlook/history/20180410/renewables.csv is the first that answers; 20180409 returns 404.
      Earlier five-minute wind is only in the 2014-2017 workbooks.
    evidence: https://www.caiso.com/outlook/history/20180410/renewables.csv
    found: 2026-11-06
  - summary: The yearly workbooks' Date column is Pacific clock time with daylight saving, so the autumn change repeats an hour with nothing to tell the two apart.
    detail: >-
      In production-and-curtailments-data-2025.xlsx, 9 March 2025 has 276 five-minute rows (no
      02:00 to 02:55) and 2 November 2025 has 300, with 01:00 to 01:55 appearing twice, both times
      as Hour 2; the year has 12 duplicated stamps. Only row order separates the first 01:00 (PDT)
      from the second (PST). Localise with the repeated hour resolved by order before converting
      to UTC. Found by an automated research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.caiso.com/documents/production-and-curtailments-data-2025.xlsx
    found: 2026-11-08
tools:
  - name: gridstatus (CAISO class)
    url: https://github.com/gridstatus/gridstatus
    language: Python
notes: >-
  System-wide wind for the CAISO area, every five minutes. Daily files are at
  https://www.caiso.com/outlook/history/<YYYYMMDD>/renewables.csv (columns Time, Solar, Wind,
  Geothermal, Biomass, Biogas, Small hydro). The yearly workbooks
  (production-and-curtailments-data-<year>.xlsx and older names on the library page) add load,
  net load and a curtailment sheet with wind and solar curtailment per interval and a reason
  (local or system). Nothing here is per plant; CAISO does not publish per-plant output openly.
status: active
