traps:
  - summary: Successor states start in 1992 and Germany in 1991; earlier years sit in separate historical series.
    detail: >-
      The former Soviet republics, Croatia, Slovenia, Bosnia and Herzegovina and North
      Macedonia hold "--" (not applicable) until 1991, Czechia and Slovakia until 1992, Serbia and
      Montenegro until 2005, and Kosovo until 2007. Germany is "--" until 1990; the earlier years
      are under the former East and West Germany series. The former USSR, Yugoslavia and
      Czechoslovakia have series of their own.
    evidence: https://www.eia.gov/opendata/bulk/INTL.zip
    found: 2026-11-06
  - summary: Guadeloupe, Martinique, Reunion and French Guiana switch to the code "ie" instead of a number from 2011.
    detail: >-
      Their wind series hold numbers to 2010 and the string "ie" from 2011 to 2024. The bulk
      file does not explain the code. Code that casts values to numbers will fail or drop these
      years.
    evidence: https://www.eia.gov/opendata/bulk/INTL.zip
    found: 2026-11-06
  - summary: >-
      Nine countries appear twice under different series ids, so adding up every wind series
      counts Brazil, China, the US and six others more than once.
    detail: >-
      Besides the country series (INTL.37-12-<ISO3>-BKWH.A) and the named regional aggregates,
      the file has sixteen INTL.37-12-WP<nn>-BKWH.A series for the regions of EIA's
      International Energy Outlook. Nine of them are single countries with the same name and
      geography as the country series: WP13 is "Wind electricity net generation, Brazil, Annual"
      with geography "BRA", exactly as INTL.37-12-BRA-BKWH.A, and both read 105.612 for 2024;
      likewise Canada (WP14), China (WP15, 997.04), India (WP16), Japan (WP17), Mexico (WP18),
      Russia (WP25), South Korea (WP26) and the United States (WP27, 451.90435659). For 2024 the
      sum of all 264 wind BKWH series is 16,732 billion kWh against 2,512 for World; the 229
      series whose id code matches their geography sum to 2,512. Filter on the series id, not
      the name or geography field, and keep only ids whose code equals the geography.
      Found by an automated research pass on 2026-11-07; not yet reviewed by a person.
    evidence: https://www.eia.gov/opendata/bulk/INTL.zip
    found: 2026-11-07
  - summary: >-
      For several smaller fleets the 2024 wind value is far from the national system
      operator's or regulator's figure, in both directions.
    detail: >-
      The catalogue's 2024 cross-check compared EIA with national publishers. Kazakhstan:
      2.653 billion kWh against 4,497.6 million kWh from the KEGOC Annual Report 2024
      ("ветровые электростанции … млн кВт•ч 4 497,6", National Dispatch Centre data).
      Colombia: 0.897 against 148.8 GWh summed from XM's SiMEM dataset 055A4D (plants 3EE4,
      3EXH and JPR1, latest settlement version). Peru: 2.092 against 3,913,508 MWh from the
      COES generation export. Pakistan: 6.859 against NEPRA's "Wind 3,941.07 3,843.36" GWh
      for the fiscal years 2023-24 and 2024-25 (State of Industry Report 2025). Bangladesh:
      0.005 against BPDB's 69 million kWh for fiscal 2023-24 and 99 for 2024-25, nearly all
      from the 60 MW Cox's Bazar farm. The causes are not established; Peru's value falls
      between COES's 2022 (1.930) and 2023 (2.353) totals, and Bangladesh's predates Cox's
      Bazar, which suggests stale figures. Russia, by contrast, is close to its system
      operator (8.279 against 8,794.1 million kWh). Check smaller countries against the
      national publisher before use. Found by an automated research pass on 2026-11-07; not
      yet reviewed by a person.
    evidence: https://ar2024.kegoc.kz/ru/download/electricity-balance
    found: 2026-11-07
notes: >-
  Annual wind electricity net generation in billion kWh (also given in
  terajoules, quadrillion Btu and million tonnes of oil equivalent), 1980 to 2024, for every country EIA tracks. Series ids follow
  INTL.37-12-<ISO3>-BKWH.A. The bulk file (INTL.zip, about 24 MB, one JSON object per line) needs
  no key; the API v2 international route serves the same data but needs a free key. EIA compiles
  the series from national and international sources; whether a value is reported or estimated
  is not flagged in the bulk file. Checked by downloading INTL.zip on the check date and reading
  every wind generation series; Kosovo's code XKS and Antarctica (AQ) appear as EIA gives them.
  Note that Ember's methodology describes EIA data as gross generation, but EIA labels these
  series net. Corrected 2026-11-07: the area field said 225 country series; a recount of
  INTL.zip found 229, the extra four under four-letter EIA codes (DEUW, NLDA, HITZ, USIQ).
  Checked 2026-11-08 (INTL.zip re-read): the country list is right to omit Curacao (CW) and
  Bonaire (BQ). The file has no CUW, BES or SXM series. It still carries a Netherlands Antilles
  series (INTL.37-12-NLDA-BKWH.A) to 2024, non-zero from 1993 and 0.236 billion kWh for each of
  2022 to 2024, which presumably holds their wind; the file does not say which islands it
  covers, so it is not mapped to an ISO code here. Aruba (ABW) has its own series from 1986 ("--" before) and
  is non-zero from 2009 (0.136 for 2024), so AW stays listed. For any one island use the
  national publisher (bq-cbs-electricity-production-by-island,
  cw-aqualectra-annual-report-wind-intake). Corrected 2026-11-08: coverage.update gave the bulk file's
  last update as 16 October 2026; the server's Last-Modified header for INTL.zip reads "Mon, 19
  Oct 2026 19:55:35 GMT", and the wind series' own last_updated stamps are no later than
  2026-04-01 (World). Rechecked 2026-11-08 from a fresh INTL.zip: 229 wind series whose id code
  matches their geography, 145 with a non-zero year, which map to exactly the 142 codes listed
  plus DEUW, NLDA and XKS; World 2024 is 2,511.68 billion kWh.
