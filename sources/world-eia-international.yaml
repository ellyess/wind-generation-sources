area: >-
  The bulk file has 229 country and territory series for wind net generation (225 under
  three-letter codes, plus West Germany, Netherlands Antilles, the Hawaiian Trade Zone and U.S.
  Pacific Islands under four-letter EIA codes); the 142 listed in countries had a non-zero value
  in at least one year. Kosovo (EIA code XKS) also has wind data but no ISO
  3166-1 code. Regional and historical aggregates (World, OECD, former USSR, former Yugoslavia,
  East and West Germany) are separate series.
