notes: >-
  Ørsted offers two operational data packages, each with two years of 10-minute SCADA
  (supervisory control and data acquisition) data for all turbines: nacelle wind speed,
  electrical power, rotor speed, yaw position and pitch angle, with on-site wave buoy and
  ground-based lidar statistics, turbine locations and SCADA documentation. Applications go
  through a form on the page only; requests for extra variables are rejected. The 2018 Ørsted news
  release on Westermost Rough (35 Siemens Gamesa 6 MW turbines, running since 2015) also mentions
  earlier sharing of Horns Rev 1 data. Coverage start is a lower bound for Westermost Rough taken
  from that release; the publisher gives no calendar years for either package, and Anholt's
  package may start earlier. Listed so readers know the route exists; data were not seen.
