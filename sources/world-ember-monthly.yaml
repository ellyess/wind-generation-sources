area: >-
  About 80 countries with a monthly wind series in the global file (40 European, 19 Asian, 8
  South American, 7 North American, 5 African, 2 in Oceania); only the European ones are listed
  in countries. Kosovo is also covered but has no ISO 3166-1 code.
