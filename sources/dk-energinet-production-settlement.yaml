id: dk-energinet-production-settlement
name: Production and Consumption - Settlement (ProductionConsumptionSettlement)
publisher: Energinet (Energi Data Service)
publisher_role: tso
countries: [DK]
area: "Price areas DK1 (west) and DK2 (east)"
level: zone
technology: onshore-and-offshore-split
measure: metered-energy
resolution: hourly
coverage:
  start: 2005
  update: daily, with a 9 to 15 day delay; values revised for up to 2 years
capacity: separate-dataset
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: UTC
  timestamp: period-start
  unit: MWh
  value: period-total
  evidence: "https://api.energidataservice.dk/meta/dataset/ProductionConsumptionSettlement"
  note: >-
    The metadata defines HourUTC so that "00:00 o'clock is the first hour of a given day
    interval 00:00 - 00:59", so each stamp opens its hour. The four wind columns are in MWh.
    HourDK gives the same hours in Danish local time, with 23 or 25 hours on clock-change days.
    JSON stamps carry no Z suffix. Read 2026-11-06 by an automated research pass; not yet
    reviewed.
access:
  method: api
  url: https://www.energidataservice.dk/tso-electricity/ProductionConsumptionSettlement
  docs: https://www.energidataservice.dk/guides/api-guides
  key_required: false
  registration: false
  formats: [json, csv, xlsx]
  languages: [en, da]
licence:
  name: Creative Commons CC-BY 4.0
  spdx: CC-BY-4.0
  url: https://www.energidataservice.dk/terms-and-conditions
  redistribution: allowed-with-attribution
  attribution: "Source: Energinet (www.energidataservice.dk)"
  verified: true
  note: >-
    The terms page says users may copy, change and distribute the data, even commercially, with
