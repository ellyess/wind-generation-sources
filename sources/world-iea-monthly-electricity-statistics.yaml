traps:
  - summary: Monthly values are scaled to match the latest annual data, so they are not the raw monthly reports.
    detail: >-
      The documentation says monthly electricity data are adjusted proportionately to keep them
      consistent with the most recent annual data for each source, and that historic data are
      often revised, so the latest release should be used.
    evidence: https://www.iea.org/files/871a6316-8470-4f6f-840e-f004cbd953fd/Monthly_electricity_statistics_Documentation_Sep_2026.pdf
    found: 2026-11-06
  - summary: Several countries' net figures are IEA estimates converted from gross reports.
    detail: >-
      The country notes say China's and India's raw monthly data are gross and the published net
      values are IEA estimates; Colombia's monthly submissions are gross and net is estimated; China
      reports January and February combined, which the IEA splits. Brazil and India monthly data
      cover only main producers, with the remainder estimated from annual submissions.
    evidence: https://www.iea.org/files/871a6316-8470-4f6f-840e-f004cbd953fd/Monthly_electricity_statistics_Documentation_Sep_2026.pdf
    found: 2026-11-06
  - summary: Non-OECD countries start in January 2015, not 2010, and some OECD members start later.
    detail: >-
      The documentation gives January 2010 for OECD countries and January 2015 for others;
      Costa Rica starts in January 2020. Country borders also differ from ISO, for example France
      includes its overseas departments from January 2017 (or 2018, per the country notes), Italy
      includes San Marino and the Vatican, and the United States includes Puerto Rico and Guam.
    evidence: https://www.iea.org/files/871a6316-8470-4f6f-840e-f004cbd953fd/Monthly_electricity_statistics_Documentation_Sep_2026.pdf
    found: 2026-11-06
notes: >-
  Monthly net electricity production by source in GWh, with wind (onshore and offshore together)
  as one product, from the IEA's Monthly Electricity Questionnaire to national administrations,
  supplemented by other sources and IEA estimates where national data are missing. Free, but
  downloading needs a free IEA account; files are SDMX zips, and the .Stat Data Explorer exports
  CSV and Excel, per the product page (the legacy CSV file was discontinued after the August 2026
  release). The data themselves were not downloaded for this entry, so per-country wind coverage is
  unverified; the description, licence and documentation were read on the check date. The
  documentation says the data can also be viewed in interactive charts at
  https://www.iea.org/data-and-statistics/data-tools/monthly-electricity-statistics.
status: restricted
