id: world-iea-monthly-electricity-statistics
name: Monthly Electricity Statistics (MES Generation)
publisher: International Energy Agency (IEA)
publisher_role: statistics-office
countries: [AL, AR, AT, AU, BA, BE, BG, BR, CA, CH, CL, CN, CO, CR, CY, CZ, DE, DK, EE, ES, FI, FR, GB, GE, GR, HR, HU, IE, IN, IS, IT, JP, KR, LT, LU, LV, ME, MK, MT, MX, NL, NO, NZ, PL, PT, RO, RS, SE, SI, SK, TR, US]
area: >-
  The countries are those named in the documentation's country list (OECD members except Israel,
  which the documentation says is not included, plus selected non-OECD economies). The product
  page says 47 countries; the documentation list has 52 names. Whether each has a wind series was
  not checked because the data need a login. Regional totals (OECD, OECD Europe, IEA Total) are
  included.
