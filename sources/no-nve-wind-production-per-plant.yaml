id: no-nve-wind-production-per-plant
name: Wind power production per plant, 2002-2021 (vindprod2002-2021_kraftverk)
publisher: Norwegian Water Resources and Energy Directorate (NVE)
publisher_role: government
countries: [NO]
level: farm
technology: onshore-and-offshore-combined
measure: metered-energy
resolution: hourly
coverage:
  start: 2002
  end: 2021
capacity: separate-dataset
coordinates: separate-dataset
curtailment: not-reported
conventions:
  timezone: "UTC+01:00"
  timestamp: unknown
  unit: unknown
  value: unknown
  evidence: https://www.nve.no/media/13399/vindprod2002-2021_kraftverk_utcplus1.xlsx
  note: >-
    The file name ending 'utcplus1' is the only statement of the time base; stamps run hourly from
    2002-01-01 00:00 in a column headed 'timestamp', under rows of plant name (kraftverknavn) and
    number (kraftverknr). The sheet gives no unit and does not say whether a value is an hourly
    energy or an average, or which end of the hour the stamp marks, and no NVE page describing the
    file was found. A Meventus report for NVE
    (https://www.nve.no/media/13401/mev-ws-2022-001-vind-og-produksjonsindekser-for-vindkraft-i-norge-2021.pdf)
    describes the underlying data as hourly aggregated production per plant registered by Statnett
    at the feed-in point. Read 2026-11-06 by an automated research pass; not yet reviewed.
    Checked 2026-11-08 on the downloaded file: 175,320 hourly rows from 2002-01-01 00:00 to
    2021-12-31 23:00 with no gap or repeated hour at any daylight-saving change, which fits a
    fixed UTC+1 base. The data suggest, but NVE does not state, MWh per hour: each plant's
    highest value sits just under its registered capacity (Roan 251.0 against 255.6 MW, Kvitfjell
    191.3 against 197.4 MW in NVE's register).
access:
  method: bulk-download
  url: https://www.nve.no/media/13399/vindprod2002-2021_kraftverk_utcplus1.xlsx
  key_required: false
  registration: false
  formats: [xlsx]
  languages: [no]
licence:
  name: "Not found for this file; NVE's APIs are under NLOD (version not stated)"
  url: "https://api.nve.no/doc/"
  redistribution: unclear
  verified: true
  note: "NVE's API documentation gives NLOD, 'compatible with CC BY 3.0', and asks for a link to the service. No terms were found for the per-plant production file itself."
traps:
  - summary: The file ends at 22:00 UTC on 31 December 2021, so the year's last hour is missing.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/findings/scorecard.md
  - summary: Times are UTC+1 all year (as the file name says), not Norwegian local time.
    evidence: https://www.nve.no/media/13399/vindprod2002-2021_kraftverk_utcplus1.xlsx
  - summary: There is no update after 2021; later years need another source.
    detail: >-
      Statistics Norway's monthly wind production (table 12824) matched this file's metered
      output in every month of 2015-21, and ENTSO-E's Norwegian generation matched Statistics
      Norway in 2023.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/findings/scorecard.md
  - summary: NVE's other hourly per-plant file, timeseries_utc_kwh_2022_all.zip, holds modelled production, not metered output, filled back to 2003 for every plant.
    detail: >-
      The file (https://www.nve.no/media/14352/timeseries_utc_kwh_2022_all.zip) has per-plant
      production columns, so it is easy to take for metered output or a newer release of this
      file. PyVWF found its output modelled back to 2003 for every farm, including farms built in
      2021, and does not use it as observations. For metered output use this file. Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/scripts/region_tools/build_no_obs_from_nve.py#L15-L16
    found: 2026-10-25
  - summary: NVE's turbine register dates turbines when they are formally commissioned, often months after they start producing, so a new farm's output can exceed the capacity it is given.
    detail: >-
      This file has no capacity; the usual denominator is NVE's register
      (https://api.nve.no/web/WindPowerplant/GetWindPowerPlants), whose turbine groups carry a
      commissioning date. In build-out months a farm's output is set against capacity the
      register has not yet given it. PyVWF counts a farm in a month only when it is metered every
      hour, its registered capacity is above zero and unchanged all month, and its output never
      exceeds 1.05 times that capacity; that keeps 91 to 99.8% of each year's metered energy in
      2015-21. A calm build-out month can still pass that test against too small a capacity.
      Added 2026-11-10 from PyVWF's records; not yet reviewed by a person.
    evidence: https://github.com/ellyess/PyVWF/blob/03a6f89215c47ce8af68431e1dff5134a71c94c5/scripts/region_tools/build_no_obs_from_nve.py#L18-L24
    found: 2026-10-25
notes: >-
  Hourly output per wind farm, metered at the grid connection. Capacity, turbines and
  commissioning dates come from NVE's wind power plant register API
  (https://api.nve.no/web/WindPowerplant/GetWindPowerPlants). For 2015-21
  this file is a better measure of the Norwegian fleet than ENTSO-E's summed zones.
status: discontinued
last_checked: 2026-11-08
checked_by: Ellyess Benmoufok, from the PyVWF ENTSO-E runbook and scorecard audits; licence read on the publisher's page 2026-11-06; links and conventions re-checked by an automated pass 2026-11-08
