id: es-ree-esios-real-time-wind
name: ESIOS real-time wind generation (Generación T.Real eólica, indicator 551)
publisher: Red Eléctrica (REE), system operator information system ESIOS
publisher_role: tso
countries: [ES]
area: Peninsular Spain (mainland system); the islands and Ceuta and Melilla are in indicator 1745
level: zone
technology: onshore-and-offshore-combined
measure: reported-generation
resolution: 5min
coverage:
  start: 2015
  update: every 5 minutes, near real time
capacity: separate-dataset
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: Europe/Madrid
  timestamp: unknown
  unit: MW
  value: unknown
  evidence: "https://api.esios.ree.es/doc/indicator/getting_a_specific_indicator_filtering_values_by_a_date_range.html"
  note: >-
    The public analysis page for indicator 551 shows values in MW at five-minute grouping
    (5,482.0 MW for 26/10/2025 23:55), and REE's indicator list calls it generation "medida en
    tiempo real". The ESIOS API documentation's example response gives each value a local
    "datetime" with its offset and a separate "datetime_utc". Whether a value is a snapshot or a
    five-minute mean, and whether the stamp opens or closes the interval, are not stated. Read
    2026-11-06 by an automated research pass; not yet reviewed.
