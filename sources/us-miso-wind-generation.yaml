id: us-miso-wind-generation
name: Historical Hourly Wind Data and Historical Generation Fuel Mix (market reports)
publisher: Midcontinent Independent System Operator (MISO)
publisher_role: iso-rto
countries: [US]
area: MISO footprint (central and southern US), split into North, Central and South regions in the fuel-mix file
level: zone
technology: onshore
measure: estimated-generation
resolution: hourly
coverage:
  start: 2023
  update: daily (year-to-date files)
capacity: none
coordinates: not-applicable
curtailment: not-reported
access:
  method: bulk-download
  url: https://www.misoenergy.org/markets-and-operations/real-time--market-data/market-reports/
  docs: "https://docs.misoenergy.org/marketreports/Historical%20Hourly%20Wind%20Data_Historical%20Hourly%20Wind%20Data%20Report%20Readers%20Guide.pdf"
  key_required: false
  registration: false
  formats: [csv, xlsx]
  languages: [en]
licence:
  name: MISO website Terms of Use
  url: "https://www.misoenergy.org/meet-miso/legal-and-privacy/"
  redistribution: prohibited
  verified: true
  note: >-
    The terms say users may not publish, transmit, reproduce, distribute or otherwise exploit any
