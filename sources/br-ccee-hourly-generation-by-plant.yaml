traps:
  - summary: The main generation figure is a market-accounting value at the submarket's centre of gravity, in average MW, not a raw meter reading.
    detail: >-
      GERACAO_CENTRO_GRAVIDADE is the plant portion's final generation after internal loss and
      loss-allocation factors (both are separate columns). The file also carries
      GERACAO_VERIFICADA_ONS, the operator's verified generation, which is the closer match to
      ONS's own series. Pick one deliberately and convert MWmed to MWh per hour.
    evidence: https://dadosabertos.ccee.org.br/api/3/action/package_show?id=geracao_horaria_usina
    found: 2026-11-06
  - summary: Plants are identified only by a CCEE acronym and a numeric plant-portion code, with no ANEEL plant code (CEG), state or location.
    detail: >-
      Joining to ONS or ANEEL registers needs a mapping from SIGLA_USINA / CODIGO_PARCELA_USINA,
      which this dataset does not provide. A plant can also be split into several portions.
    evidence: https://dadosabertos.ccee.org.br/api/3/action/package_show?id=geracao_horaria_usina
    found: 2026-11-06
  - summary: The June 2026 resource is described as consumption data rather than generation.
    detail: Check the columns of each monthly file before appending it to a series.
    evidence: https://dadosabertos.ccee.org.br/dataset/geracao_horaria_usina
    found: 2026-11-06
notes: >-
  Hourly settlement-period generation for each plant portion in the Brazilian market, with primary
  source (FONTE_PRIMARIA) and plant type, so wind plants can be selected. About 36 columns per row,
  including verified ONS generation, constrained-on and out-of-merit generation. Per-plant columns
  documented; data not downloaded: the portal pages were read through a fetch service, but direct
  downloads (pda-download.ccee.org.br) and the CKAN API returned an "access blocked" page to this
  connection on 2026-11-06, so the content of the files, the per-plant split for wind and the
  delimiter were not checked. Coverage start is the first file listed (March 2024). For a longer
  hourly per-plant record use br-ons-generation-by-plant-hourly (from 2006).
status: active
last_checked: 2026-11-06
checked_by: "Claude Code research pass for Ellyess Benmoufok, 2026-11-06; not yet reviewed by a person"
reviewed: false
