id: br-ccee-hourly-generation-by-plant
name: Hourly generation by plant (GERACAO_HORARIA_USINA)
publisher: Câmara de Comercialização de Energia Elétrica (CCEE)
publisher_role: market-operator
countries: [BR]
area: Brazilian electricity market, four submarkets (North, Northeast, South, Southeast/Centre-West)
level: farm
technology: onshore
measure: reported-generation
resolution: hourly
coverage:
  start: 2024
  update: monthly (the listing ran from March 2024 to September 2026 at the check)
capacity: none
coordinates: none
curtailment: unknown
conventions:
  timezone: unknown
  timestamp: unknown
  unit: MW
  value: period-mean
  evidence: https://dadosabertos.ccee.org.br/api/3/action/package_show?id=geracao_horaria_usina
  note: >-
    Rows carry MES_REFERENCIA, DATA (the day containing settlement period "j") and
    PERIODO_COMERCIALIZACAO, a one-hour settlement period numbered within the reference month. The
    metadata do not say which clock hour period j covers or in which time zone. GERACAO_CENTRO_GRAVIDADE
    is documented in MWmed (average MW over the hour, numerically MWh per hour); the other generation
    column, GERACAO_VERIFICADA_ONS, is documented in MWh. Metadata read through a fetch service; direct
    requests from this connection were refused with an "access blocked" page, and no file was opened.
    Read 2026-11-06 by an automated research pass; not yet reviewed.
access:
  method: bulk-download
