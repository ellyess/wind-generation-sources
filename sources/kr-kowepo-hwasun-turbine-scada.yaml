traps:
  - summary: Turbine 1's longitude is about one degree west of the other seven.
    detail: >-
      Turbine 1 is given at 35.092972, 126.054111, while turbines 2 to 8 sit between 127.050 and
      127.065 east, all on the same mountain address in Dong-myeon. 126.054 is far outside
      Hwasun county, so it looks like a typing error for 127.054; check before any spatial join.
    evidence: https://www.data.go.kr/data/15159036/fileData.do
    found: 2026-11-06
  - summary: The CSV is CP949 (EUC-KR) encoded, not UTF-8.
    detail: >-
      Read it with encoding cp949. Timestamps are "YYYY-MM-DD HH" with hours 00 to 23; the time
      zone and whether a value is an hourly mean or a sample are not stated.
    evidence: https://www.data.go.kr/data/15159036/fileData.do
    found: 2026-11-06
  - summary: Power is grid active power in kW, including small negative values when the turbine idles.
    detail: >-
      The output column (계통 유효 전력, kW) runs from about -26 kW to just over 2,040 kW per 2 MW
      turbine. Treat it as power, not hourly energy, and decide how to handle the negative
      standby draw before summing.
    evidence: https://www.data.go.kr/data/15159036/fileData.do
    found: 2026-11-06
notes: >-
  Hourly SCADA data for each of the eight turbines at Hwasun (발전호기 1 to 8): nacelle wind speed
  in m/s and grid active power in kW, with the address, decimal latitude and longitude,
  manufacturer (Unison), rated capacity (2 MW), hub height (80 m), rotor diameter (93 m) and
  model (U93) on every row. Checked 2026-11-06: the file (화순풍력_스카다 발전정보(2015-2025).csv,
  79 MB, 704,754 rows) runs from 2015-12-01 00 to 2025-12-31 23, about 88,094 hours per turbine,
  with a few hours missing in most years; turbines 3 and 4 give 817.955 kW and 386.182 kW at
  2016-01-11 17, so the series are distinct. Nacelle wind speed makes this useful for power-curve
  work as well as validation. KOWEPO also published an earlier farm-level hourly file for Hwasun
  and Jangheung, 2017 to June 2023 (https://www.data.go.kr/data/15106292/fileData.do; entry
  kr-kowepo-wind-farm-hourly), whose dates run about eleven months off this series, so use this
  one for timing. The Jangheung turbines are published separately
  (kr-kowepo-jangheung-turbine-scada).
status: fixed-release
