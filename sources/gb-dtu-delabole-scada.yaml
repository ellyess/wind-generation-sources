id: gb-dtu-delabole-scada
name: Scada data from Delabole wind farm
publisher: DTU Wind Energy, Technical University of Denmark (via DTU Data)
publisher_role: research
countries: [GB]
area: Delabole wind farm, North Cornwall, England (10 Windane 34 turbines, 400 kW each)
level: turbine
technology: onshore
measure: reported-generation
resolution: 10min
coverage:
  start: 1993
  end: 1994
  update: fixed historical release (August 2021); covers May 1993 to April 1994
capacity: separate-dataset
coordinates: separate-dataset
curtailment: not-reported
conventions:
  timezone: UTC
  timestamp: unknown
  unit: kW
  value: unknown
  evidence: "https://gitlab.windenergy.dtu.dk/fair-data/winddata-revamp/winddata-documentation/-/blob/master/wind_farm/delabole/report.pdf"
  note: >-
    In delabole_concurent.nc the time variable has units "minutes since 1993-05-01 04:40:00"
    with no zone (CF conventions read a missing zone as UTC, but the file does not say so).
    poa01 to poa10 have long_name Active Power and units kW. The summary says the data are
    10-minute statistics but the power variables do not say which statistic, or whether the
    stamp opens or closes the period. Read 2026-11-06 by an automated research pass; not yet
    reviewed. Updated 2026-11-07: timezone set from unknown to UTC. The site documentation
    links the 1994 technical performance report, whose Appendix B (page 171, a scanned table)
    gives the database's "TIME, Time of record, hh/mm/ss GMT". DTU does not restate it for the
    NetCDF files, but the data agree: delabole_all.nc has records at 01:00 to 01:50 on 27 March
    1994, the hour UK clocks skipped, so the stamps are not UK local time. The same appendix
    (page 173) lists four power statistics per turbine (mean, 3-second maximum, 3-second
    minimum, standard deviation); which one poa holds is not stated, so value stays unknown
    (see the trap).
