id: lt-litgrid-open-data-wind
name: Litgrid open data, actual national wind power production (dataset 106)
publisher: Litgrid AB
publisher_role: tso
countries: [LT]
level: country
technology: onshore
measure: reported-generation
resolution: hourly
coverage:
  start: 2023
  update: stated as hourly, but the series had stopped at 20 July 2026 when checked
capacity: separate-dataset
coordinates: not-applicable
curtailment: unknown
conventions:
  timezone: UTC
  timestamp: unknown
  unit: MW
  value: unknown
  evidence: https://www.litgrid.eu/wp-content/uploads/2026/03/Faktine-nacionaline-vejo-elektriniu-gamyba-MW_Metaduomenys.docx
  note: >-
    The dataset metadata (docx, in Lithuanian) defines 'ltu' as date and time in EET or Lithuanian
    time, 'utc' as date and time in UTC, and 'value' as the value at a given moment (MW); it also
    says the hourly figures are accumulated from data published every two minutes, with the previous
    hour published each hour. It does not say whether the hourly value is an average of the
    two-minute readings or which end of the hour the stamp marks. The utc column is wrong on spring
    clock-change days (see trap). Read 2026-11-06 by an automated research pass; not yet reviewed.
    Rechecked 2026-11-07 against the metadata docx ("Skelbiami valandiniai akumuliuoti duomenys
    ... susidedantys iš kas 2 minutes skelbiamų duomenų"; value "tam tikru laiko momentu (MW)"):
    the two statements conflict and neither says mean or snapshot, so the value stays unknown.
access:
  method: api
  url: https://www.litgrid.eu/en/open-data-sets/actual-national-wind-power-production
  docs: https://www.litgrid.eu/open-data-api-instrukcijos
  key_required: false
  registration: false
  formats: [json, csv, xml]
  languages: [lt, en]
