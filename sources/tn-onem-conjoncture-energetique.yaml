traps:
  - summary: Figures are cumulative from January to the bulletin month, not single months.
    detail: >-
      The August 2026 bulletin gives STEG wind production "à fin août" (85 GWh in 2026 against
      191 GWh in 2025, and 259 GWh for all of 2025). Monthly values need differencing between
      successive bulletins, and not every month's bulletin is listed on the page.
    evidence: https://www.energiemines.gov.tn/fileadmin/docs-u1/Conjoncture_%C3%A9nerg%C3%A9tique__Ao%C3%BBt__2026.pdf
    found: 2026-11-06
  - summary: The wind row is STEG's own production only.
    detail: >-
      The production table lists wind under STEG (the national utility); private generation
      appears only as independent solar, solar self-producers and third-party purchases, so any
      private wind would sit in "Achat tiers", not in the wind row.
    evidence: https://www.energiemines.gov.tn/fileadmin/docs-u1/Conjoncture_%C3%A9nerg%C3%A9tique__Ao%C3%BBt__2026.pdf
    found: 2026-11-06
notes: >-
  Monthly year-to-date national electricity production by source in GWh, with a wind row. The
  same page holds the annual Bilan National de l'Energie (2010 to 2025, the last provisional) and
  annual key figures (Chiffres clés). Coverage start is the oldest bulletin listed (March 2020),
  which has the wind row; older bulletins may exist elsewhere. The large fall in 2026 wind output
  coincides with press reports of rehabilitation work at the Sidi Daoud wind plant; not verified
  on a STEG page. STEG's own website (steg.com.tn) refused connections on 2026-11-06.
