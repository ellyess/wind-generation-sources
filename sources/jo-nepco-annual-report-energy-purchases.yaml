traps:
  - summary: These are NEPCO's purchases from wind farms on its transmission network, not all wind generation.
    detail: >-
      The tables count energy bought by NEPCO as single buyer. Table (3) lists wind capacity on
      the transmission network only (621 MW, all direct offers), so any wind connected to the
      distribution networks or used on site is outside these figures. Found by an automated
      research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://nepco.com.jo/store/DOCS/web/2024_EN.pdf
    found: 2026-11-08
notes: >-
  Annual wind energy purchased by Jordan's transmission system operator and single buyer, five
  years per report (2020 to 2024 in the 2024 report, 96 pages, 17.7 MB). Wind purchases rose
  9.1% in 2024 to 1,796.7 GWh. The report gives no per-farm or monthly wind series. Earlier
  reports were not checked.
