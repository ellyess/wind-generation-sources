traps:
  - summary: The wind column is ČEPS's estimate, identical to its "Generation RES" series, which the web service describes as an estimate of renewable output.
    detail: >-
      WPP [MW] from the Generation operation matched value1 of GenerationRES to within 0.1 MW for
      every quarter hour tried in June 2025 and November 2026. The web service lists that
      operation as "Generation RES (Odhad výroby obnovitelných zdrojů)", Czech for "estimate of
      renewable generation". Treat it as an estimate, not metered output.
    evidence: https://www.ceps.cz/_layouts/CepsData.asmx
    found: 2026-11-06
  - summary: The first year, 2009, is incomplete and implausibly low in places.
    detail: >-
      Monthly averages for 2009 have no value for January or March and fall to 0.5 MW and 0.2 MW
      in July and August, against about 10 MW in May and June. Start any analysis in 2010 or
      check 2009 against the regulator's monthly reports.
    evidence: https://www.ceps.cz/en/all-data#Generation
    found: 2026-11-06
  - summary: Timestamps are local time with an explicit offset, and the autumn change day has 100 quarter hours.
    detail: >-
      On 26 October 2025 the hour 02:00 appears twice, first with +02:00 and then with +01:00.
      Parse the offset rather than the clock time.
    evidence: https://www.ceps.cz/en/all-data#Generation
    found: 2026-11-06
notes: >-
  Generation by type in MW (TPP, CCGT, NPP, HPP, PsPP, AltPP, ApPP, WPP for wind, PVPP for
  solar), for all of Czechia. Available on the All data page (TXT, CSV, XML download) and
  through the CepsData SOAP web service (operation Generation with dateFrom, dateTo, agregation
  such as QH, HR, DY or MO, function AVG, version RT, para1 all). Checked by requesting days in
  2010, 2012, 2015, 2025 and 2026 and seeing different values. The web service description
  (version 3.2, on the web services page) defines the Generation data set as "Total gross
  electricity generation within the Czech power system according to individual power plant
  type", so WPP is gross output, before the plants' own consumption; compare it with gross, not
  net, figures. Nothing on the site says how distribution-connected wind is covered. For energy
  totals use the Energy Regulatory Office's monthly figures (cz-eru-electricity-operation-reports).
  Corrected 2026-11-07: these notes said nothing on the site stated gross or net; the web
  service description does.
