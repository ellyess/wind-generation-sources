  evidence: https://www.ceps.cz/en/web-services
  note: >-
    The web service description ("ČEPSVIP_Description of WS interface for structured data
    delivery 3.2.docx", downloaded from the evidence page) says "The interface operates using
    local time (CET/CEST)" and that request times are read as local time whatever offset is
    given. Responses carry an explicit offset (+01:00 or +02:00), and the October change day
    repeats 02:00 with each offset. For Generation it says data "are represented as average
    minute power output", the AVG function gives "average output [MW]", and in the hour
    aggregation average output equals energy in MWh. It does not say whether a quarter-hour
    stamp marks the start or end of its interval; a request from 00:00 returns a first item
    stamped 00:00, which suggests start but is not documented. The same description calls the
    data set "Total gross electricity generation". Read 2026-11-06 by an automated research pass;
    not yet reviewed.
