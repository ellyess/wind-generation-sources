notes: >-
  Ten-minute SCADA (supervisory control and data acquisition) statistics for 14 Senvion MM82
  turbines, 2.05 MW each, exported from the operator's Greenbyte system in the same layout as the
  Kelmarsh dataset (same publisher): power, energy, wind, status logs and lost-production
  estimates including curtailment, plus substation and fiscal grid meter data. A static CSV gives
  coordinates, rated power, hub height and rotor diameter. Times are UTC per the file headers.
  The same header quirk as Kelmarsh applies (the column header line begins with '#'); it was
  confirmed here on the grid meter file. Turbine SCADA archives were not downloaded for this
  check; contents are as listed on the record.
