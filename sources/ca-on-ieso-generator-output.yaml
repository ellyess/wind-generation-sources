traps:
  - summary: Output is from operational metering, accurate to about plus or minus 10 MW, and is posted unvalidated.
    detail: >-
      The report description says operational meters are less accurate and less reliable than
      revenue meters, telemetry faults show as N/A, and values are not checked before posting.
      For small wind farms a 10 MW error is a large fraction of output.
    evidence: https://reports-public.ieso.ca/docrefs/helpfile/GenOutputCapability_h4.pdf
  - summary: For wind, the capacity row is "Available Capacity" (nameplate minus outages), not what the wind allowed.
    detail: >-
      Available Capacity ignores the wind resource; the "Forecast" row adds it. During
      commissioning the report sets capability equal to output, so capacity factors from those
      months are meaningless.
    evidence: https://reports-public.ieso.ca/docrefs/helpfile/GenOutputCapability_h4.pdf
  - summary: The 2010 to April 2019 archive is one wide sheet per year with a column per generator and no fuel type.
    detail: >-
      GOC-<year>.xlsx has sheets "Output" and "Capability", columns DATE, HOUR, then one column
      per generator name. The May 2019 onward monthly CSVs are long format with a Fuel Type
      column. Use the newer files to tag which names are wind.
    evidence: https://www.ieso.ca/-/media/Files/IESO/Power-Data/data-directory/GOC-2010.xlsx
    found: 2026-11-06
  - summary: Only generators of 20 MW or more are listed, so smaller wind farms are missing.
    evidence: https://reports-public.ieso.ca/docrefs/helpfile/GenOutputCapability_h4.pdf
  - summary: The monthly folder holds several copies of each month, so downloading every file double-counts days.
    detail: >-
      Each month has an unversioned file and one or more versioned ones, and each version is a
      month-to-date snapshot rather than a correction. On 2026-11-07 the folder held
      PUB_GenOutputCapabilityMonth_202611.csv with _v3, _v4 and _v5: _v3 ("Created at 2026-11-04
      06:00:08") covers 1 to 3 November, _v5 covers 1 to 5 November, its rows for 1 to 3
      November are identical to _v3's, and the unversioned file is byte-identical to _v5. Past
      months keep the unversioned file and a final version (_v31 for October 2026), also
      byte-identical. Download only the unversioned file per month. No revised values were seen
      between versions, but only one month was compared. Found by an automated research pass on
      2026-11-07; not yet reviewed by a person.
    evidence: https://reports-public.ieso.ca/public/GenOutputCapabilityMonth/
    found: 2026-11-07
  - summary: >-
      Every data row of the monthly CSVs ends with an extra comma, so pandas shifts the columns
      one place unless told not to use the first column as the index.
    detail: >-
      After three lines of preamble ("\\Generator Output Capability Month Report", "\\Created
      at 2026-11-01 06:00:08", "\\For October 2026"), the header "Delivery Date,Generator,Fuel
      Type,Measurement,Hour 1,...,Hour 24" has 28 fields, but each data row has 29, for example
      "2026-10-01,ABKENORA,HYDRO,Output,7,7,...,7,". pandas read_csv then takes the first column
      as the index, so "Delivery Date" holds the generator name, "Generator" the fuel type, and
      every hour column holds the next hour's value, with no error raised. The May 2019 file has
      the same layout. Read with skiprows=3 and index_col=False. Found by an automated research
      pass on 2026-11-07; not yet reviewed by a person.
    evidence: https://reports-public.ieso.ca/public/GenOutputCapabilityMonth/PUB_GenOutputCapabilityMonth_202610.csv
    found: 2026-11-07
tools:
  - name: gridstatus (IESO class, generator report)
    url: https://github.com/gridstatus/gridstatus
    language: Python
notes: >-
  Hourly output for each Ontario generator of 20 MW or more, by name. History is in yearly
  workbooks GOC-2010 to GOC-2019 (January-April) on the data directory, then monthly CSVs from May
  2019 at reports-public.ieso.ca/public/GenOutputCapabilityMonth/. Checked per plant: on
  1 October 2025, ADELAIDE, AMARANTH and ARMOW gave different hourly series, and the October 2025
  file lists 45 wind generators; the 2010 workbook also has distinct generator columns. The
  hourly output is the average of five-minute outputs. Turbine locations and hub heights are in
  Natural Resources Canada's Canadian Wind Turbine Database, which is a separate source.
status: active
last_checked: 2026-11-06
checked_by: automated research (Claude Code), 2026-11-06
reviewed: false
