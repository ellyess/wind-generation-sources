id: ca-on-ieso-generator-output
name: Generator Output and Capability Report (hourly, per generator)
publisher: Independent Electricity System Operator (IESO), Ontario
publisher_role: iso-rto
countries: [CA]
area: Ontario
level: farm
technology: onshore
measure: reported-generation
resolution: hourly
coverage:
  start: 2010
  update: hourly report; monthly CSV updated daily
capacity: included
coordinates: none
curtailment: not-reported
conventions:
  timezone: unknown
  timestamp: period-end
  unit: MW
  value: period-mean
  evidence: https://reports-public.ieso.ca/docrefs/schema/GenOutputCapability_r3.xsd
  note: >-
    The report schema documents Hour (1 to 24) as "Hour ending" and the value element EnergyMW as
    "MW output"; the report description says "The hourly output is the facility's five-minute
    outputs averaged over an hour". No time zone is stated in the schema, the report description or
    the data directory. The monthly CSVs have exactly Hour 1 to Hour 24 on every day, including
    daylight-saving change days, which suggests Eastern Standard Time all year, but that is inferred.
    Monthly CSVs are reissued as versions (_v3, _v4 ...). Read 2026-11-06 by an automated research
    pass; not yet reviewed.
access:
  method: bulk-download
  url: https://www.ieso.ca/power-data/data-directory
  docs: https://reports-public.ieso.ca/docrefs/helpfile/GenOutputCapability_h4.pdf
  key_required: false
  registration: false
  formats: [xlsx, csv, xml]
  languages: [en, fr]
