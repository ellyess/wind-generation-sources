conventions:
  timezone: UTC
  timestamp: unknown
  unit: kW
  value: period-mean
  evidence: "https://zenodo.org/records/23909980"
  note: >-
    In the 2026.10 10-minute parquet, observed_at is typed as a UTC timestamp, and the raw OPC
    payload keeps the turbine's local stamp with offset (2026-07-22T17:40:00.000+01:00 for 16:40
    UTC). The signal catalogue in the file metadata defines active_power_mean as "Mean active
    power" in kW and energy_produced as a kWh counter. Whether observed_at opens or closes the
    10-minute period is not stated. In the first rows ingested_at is earlier than observed_at (a
    16:40:00 row ingested at 16:39:25 UTC), so the turbine clock may run ahead of the ingest
    clock. Checked 2026-11-07 across the whole file: ingested_at follows observed_at by a median of
    274 seconds and a 95th percentile of 544, both less than the 600-second period, which
    suggests observed_at marks the end of the 10 minutes; not stated, so left unknown. Read
    2026-11-06 by an automated research pass; not yet reviewed.
