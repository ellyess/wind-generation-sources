notes: >-
  Ten-minute SCADA (supervisory control and data acquisition) statistics and alarm logs from 21
  Siemens SWT-2.3-VS-82 turbines (2.3 MW each), January 2016 to April 2026, taken from the
  Siemens SCADA backup and converted to CSV. Active power (wtc_ActPower) and the active power
  setpoint (wtc_PowerRef_endvalue) are included; curtailment is not reported as such, although
  the setpoint can show when output was held down. Version 2.0.0 added about 1 Hz controller
  data and two lidars for January to April 2026. Turbine metadata gives coordinates, rated
  power, hub height and rotor diameter. The yearly archives are about 1.4 to 1.6 GB each and
  were not downloaded for this check; the data dictionary and metadata files were read. The
  dataset has a changelog, and the concept DOI resolves to the latest version.
