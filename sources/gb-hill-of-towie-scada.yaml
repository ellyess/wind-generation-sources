traps:
  - summary: Turbine upgrades change the power curve partway through the record.
    detail: >-
      AeroUp blade upgrades went on turbine T13 in September 2021 and on the rest between July
      2022 and May 2023; a TuneUp trial ran on nine turbines in 2024; and a Dynamic Yaw wake
      control trial toggled 14 turbines on and off every 50 minutes from January to April 2026
      (from February for T16 to T21). Output before and after these dates is not like for like.
      Install dates are in Hill_of_Towie_AeroUp_install_dates.csv.
    evidence: https://zenodo.org/records/22662930
    found: 2026-11-06
  - summary: Timestamps mark the end of each 10-minute period, in UTC.
    detail: Subtract 10 minutes to get the period start before joining to start-stamped data.
    evidence: https://zenodo.org/records/22662930/files/Hill_of_Towie_data_dictionary.md
    found: 2026-11-06
  - summary: The computed downtime file stops in August 2024, though the SCADA runs to April 2026.
    detail: >-
      Hill_of_Towie_ShutdownDuration.zip was carried over from version 1.0.0 and was not
      extended, so downtime filtering for later months has to be rebuilt from the alarm logs.
    evidence: https://zenodo.org/records/22662930
    found: 2026-11-06
  - summary: One secondary anemometer field steps on a correction switch-on date.
    detail: >-
      wtc_SecAnemo changes on 2017-08-01 for T14 and T17 and on 2018-04-10/11 for the rest; the
      data dictionary says to use wtc_SeWindSp across those dates. Turbine north calibration
      errors can also be large and change over time.
    evidence: https://zenodo.org/records/22662930/files/Hill_of_Towie_data_dictionary.md
    found: 2026-11-06
