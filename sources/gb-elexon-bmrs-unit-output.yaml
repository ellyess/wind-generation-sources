id: gb-elexon-bmrs-unit-output
name: Actual Generation Output Per Generation Unit (B1610), Elexon Insights Solution
publisher: Elexon
publisher_role: market-operator
countries: [GB]
area: Great Britain (England, Scotland and Wales); Northern Ireland is not part of this market
level: farm
technology: onshore-and-offshore-combined
measure: metered-energy
resolution: 30min
coverage:
  start: 2019
  update: daily, about five days after the day, then revised by later settlement runs
capacity: separate-dataset
coordinates: none
curtailment: reported
access:
  method: api
  url: https://bmrs.elexon.co.uk/
  docs: https://bmrs.elexon.co.uk/api-documentation/endpoint/datasets/B1610
  key_required: false
  registration: false
  formats: [json, csv, xml]
  languages: [en]
licence:
  name: Elexon licence to use BMRS open data
  url: https://www.elexon.co.uk/bsc/data/balancing-mechanism-reporting-agent/copyright-licence-bmrs-data/
  redistribution: allowed-with-attribution
  attribution: "Contains BMRS data © Elexon Limited copyright and database right [year]"
  verified: true
  note: >-
    Worldwide, royalty-free, perpetual licence to copy, publish, distribute, adapt and exploit
