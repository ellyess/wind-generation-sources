licence:
  name: Public Data Portal terms for this dataset, scope of permitted use "no restriction" (이용허락범위 제한 없음), free of charge
  url: https://www.data.go.kr/data/15043393/fileData.do
  redistribution: allowed
  verified: true
  note: The dataset page states free use with no restriction on the scope of use. The CSV downloaded without login on the check date.
traps:
  - summary: From 2020 to 2022 the split between the two phases shifts, so per-phase series are not comparable across years.
    detail: >-
      In 2013 to 2019 and again from 2023, phase 1 (six turbines) tops out at about 12,000 kWh in
      an hour and phase 2 (four turbines) at about 8,000. In 2020, 2021 and 2022 phase 1 tops out
      at about 10,000 to 10,400 and phase 2 reaches 9,200 to 10,100 (2021-01-16, phase 2 daily
      maximum 9225), as if one turbine's output were counted under phase 2. The page gives no
      reason. Sum the two phases for a farm series. Found by an automated research pass on
      2026-11-08; not yet reviewed by a person.
    evidence: https://www.data.go.kr/data/15043393/fileData.do
    found: 2026-11-08
  - summary: Two single hours are far above what the farm can produce.
    detail: >-
      Phase 1 on 2023-02-24 reads 19390 in hour 24, against a ceiling of about 12,000 in every
      other year; phase 2 on 2015-04-19 reads 14250 in hour 11, against about 8,000. Screen hours
      above the phase's usual ceiling before using maxima or ramps. Found by an automated
      research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.data.go.kr/data/15043393/fileData.do
    found: 2026-11-08
  - summary: One row per day and phase, with the 24 hours as columns 1 to 24, and a few cells missing or "-".
    detail: >-
      Columns are date, phase (단계), daily total, mean, maximum, minimum, hourly maximum and
      minimum, then hourly kWh in columns 1 to 24. Melt to long form and shift hour 24 before
      building timestamps. Phase 1 on 2024-08-24 has "-" in hour 4, and five hourly cells are
      empty (for example phase 1 on 2024-09-17, hour 17); read them as missing, not zero. The
      file is CP949 (EUC-KR) encoded. Found by an automated research pass on 2026-11-08; not yet
      reviewed by a person.
    evidence: https://www.data.go.kr/data/15043393/fileData.do
    found: 2026-11-08
notes: >-
  Hourly energy in kWh for each phase of KOSPO's Seongsan wind farm in eastern Jeju, laid out
  like the Hankyung file (kr-kospo-hankyung-wind-hourly). Checked 2026-11-08: the file
  (한국남부발전(주)_성산풍력발전실적_20260331, 1.4 MB, registered and modified 2026-04-13) has
  4,838 daily rows per phase, every day from 2013-01-01 to 2026-03-31, with no duplicate days.
  Phase 1 summed to about 30.4 GWh in 2013 and 18.7 GWh in 2025, phase 2 to about 21.9 and
  12.1 GWh, so the series differ and both decline. The page gives no installed capacity or
  turbine positions; the ceilings in the data (about 12,000 and 8,000 kWh per hour) suggest
  2 MW turbines but this is not stated. KOSPO also publishes daily generation and daily mean wind
  speed files for Seongsan (https://www.data.go.kr/data/15076399/fileData.do and 15076400), not
  checked, and a synthetic (합성) file, 15151193, which is not observed data.
status: active
