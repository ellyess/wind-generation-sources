id: kr-kospo-seongsan-wind-hourly
name: Seongsan wind farm generation results (한국남부발전(주)_성산풍력발전실적)
publisher: Korea Southern Power Co. (KOSPO, 한국남부발전), via the Public Data Portal (data.go.kr)
publisher_role: owner-operator
countries: [KR]
area: Seongsan wind farm, Jeju island, phases 1 (turbines 1 to 6) and 2 (turbines 7 to 10) reported separately
level: farm
technology: onshore
measure: reported-generation
resolution: hourly
coverage:
  start: 2013
  update: annual (업데이트 주기 연간); current file runs to 2026-03-31, next release due 2027-05-13
capacity: none
coordinates: none
curtailment: not-reported
conventions:
  timezone: unknown
  timestamp: unknown
  unit: kWh
  value: period-total
  evidence: https://www.data.go.kr/data/15043393/fileData.do
  note: >-
    The column definitions give columns 1 to 24 as generation per time band (시간대별 발전량) in kWh,
    and the description says the bands run from 01시 to 24시 in one-hour steps; the daily total,
    mean, maximum and minimum are also kWh. The notes field on the same page says "데이터 단위: kW";
    for one hour the two read the same number. The page does not say whether band 1 is the hour
    ending at 01:00, nor the time zone. Read 2026-11-08 by an automated research pass; not yet
    reviewed.
