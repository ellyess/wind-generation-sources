traps:
  - summary: There are two monthly services; only EnergiaMensualOficial is restricted to officialised data.
    detail: >-
      The catalogue describes EnergiaMensual as monthly MWh per plant with the current and
      previous month under review, and EnergiaMensualOficial as returning "solamente datos ya
      oficializados". Use the official one for validation.
    evidence: https://apps.grupoice.com/CenceWeb/data/servicios/json/WebServices/
    found: 2026-11-06
notes: >-
  Monthly generation in MWh for every plant in Costa Rica's national system, all technologies,
  with company group and source type ("Eólico" for wind), one year per request (parameter anno,
  optional planta). Checked: 1996 has one wind plant (Plantas Eólicas, 22,565 MWh); 2005 has four
  (Tejona 60,858 MWh, MOVASA 56,257 MWh, Plantas Eólicas 63,733 MWh, Aeroenergía 23,492 MWh); 2025
  has 19 with different annual totals (Chiripa 259,710 MWh, Orosí 232,907 MWh); 1990 returns no
  rows. Plant names match the daily services in cr-cence-generation-by-plant, so the two can be
  joined. Installed capacity per plant is in the CapacidadInstalada service (only from 2023).
