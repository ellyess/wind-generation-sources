id: br-ons-capacity-factor
name: Capacity factor of wind and solar generation (Fator de Capacidade de Geração Eólica e Solar)
publisher: Operador Nacional do Sistema Elétrico (ONS)
publisher_role: tso
countries: [BR]
level: complex
technology: onshore
measure: capacity-factor
resolution: hourly
coverage:
  start: 2009
  update: daily, a few days behind, into one file per month
capacity: included
coordinates: included
curtailment: separate-dataset
conventions:
  timezone: unknown
  timestamp: unknown
  unit: fraction
  value: period-mean
  evidence: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/fator_capacidade_2_di/DicionarioDados_FatorCapacidade.pdf
  note: >-
    The data dictionary defines val_fatorcapacidade as the ratio of generation to installed capacity,
    with val_geracaoverificada in MWmed (average MW over the hour) and val_capacidadeinstalada in MW;
    in the 2018 file the factor runs 0 to about 1.06 and equals generation divided by capacity. The
    hourly stamp din_instante is described only as "Data"; neither the dictionary nor the dataset
    page states a time zone or whether it marks the start or end of the hour. Inferred from the data
    only: the 2018 file has no 2018-11-04 00:00, the hour skipped when Brazilian daylight saving began
    that night, which suggests local Brasília time with daylight saving before 2019. Read 2026-11-06
    by an automated research pass; not yet reviewed.
access:
  method: bulk-download
  url: https://dados.ons.org.br/dataset/fator-capacidade-2
  docs: https://dados.ons.org.br/api/3/action/package_show?id=fator-capacidade-2
  key_required: false
  registration: false
  formats: [csv, parquet, xlsx]
  languages: [pt]
licence:
  name: Creative Commons Atribuição (CC BY, version not stated)
  url: "https://dados.ons.org.br/dataset/fator-capacidade-2"
  redistribution: allowed-with-attribution
  attribution: Credit ONS and say what changes were made.
  verified: true
  note: No version is given, so no exact SPDX identifier. Data are provided as is and may be discontinued.
traps:
  - summary: Curtailment is severe and sits inside the capacity factor unless removed with the separate constrained-off dataset.
    detail: >-
      In June 2023 the mean curtailed fraction was about 0.11, and 142 of 157 complexes were
      constrained off by more than 5%. The constrained-off series (restricao_coff_eolica_usi)
      starts in October 2021; earlier years cannot be screened.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/br.md
  - summary: Output is per complex (conjunto), not per plant, and the coordinate is the collector substation.
    detail: Mapping complexes to individual plants through ANEEL codes is incomplete, because the plant code is often blank at complex level.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/br.md
  - summary: Files are semicolon-delimited with dot decimals, while ANEEL's registers use decimal commas and latin-1.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/br.md
  - summary: Time stamps before 2019 follow Brasília clock time with daylight saving, so one hour is missing each spring and one is lost each February.
    detail: >-
      Not documented: the data dictionary calls din_instante only "Data". In the 2018 file no
      complex has a 2018-11-04 00:00 row, the hour skipped when daylight saving began; Conj.
      Alvorada (Bahia) goes from "2018-11-03 23:00:00;18.75300000" to "2018-11-04
      01:00:00;23.18000000" (din_instante, val_geracaoverificada). On 17-18 February 2018, when
      clocks went back and 23:00 came twice, each complex has a single 23:00 row, so one hour of
      real time is lost or merged. The 2018 file has 8,759 distinct hours and the 2019 file
      8,760, one short of the real 8,761 after the February 2019 change; the 2020 file has a full
      8,784. Read pre-2019 stamps as America/Sao_Paulo, treat the February 23:00 as unreliable,
      and convert to UTC before joining to weather data. Found by an automated research pass on
      2026-11-07; not yet reviewed by a person.
    evidence: https://ons-aws-prod-opendata.s3.amazonaws.com/dataset/fator_capacidade_2_di/FATOR_CAPACIDADE_2018.csv
    found: 2026-11-07
notes: >-
  Hourly capacity factor per wind complex with its time-varying installed capacity and
  coordinates in the same file: about 152 complexes and 26 GW in mid-2023. Pair with ONS
  constrained-off data (https://dados.ons.org.br/dataset/restricao_coff_eolica_usi) to separate
  curtailment from resource. Resource names on the portal start in 2009.
  Corrected 2026-11-08: coverage.update said monthly. On 2026-11-08 the portal already listed
  Fator_Capacidade_2-2026-11, and FATOR_CAPACIDADE-2_2026_11.parquet held hours from 2026-11-01
  00:00 to 2026-11-05 23:00 for 152 wind complexes, so the current month's file is refreshed
  within the month. The 2009 file starts at 2009-07-01 00:00 with two wind complexes.
status: active
last_checked: 2026-11-08
checked_by: Ellyess Benmoufok and Claude Code; traps from the PyVWF runbook, metadata read via the ONS CKAN API; licence read on the publisher's page 2026-11-06; links and conventions re-checked by an automated pass 2026-11-08
