traps:
  - summary: The active power variables are labelled with units of rpm.
    detail: >-
      In UEBB_v1.nc, active_power_total and its min and max carry the units attribute 'rpm'
      (copied from the rotor speed variables), although the values run from 0 to 840 and are
      plainly kW for the Enercon E-48 turbines. Code that trusts the units attribute will
      mislabel or reject the power series. Checked again on 2026-11-07 in both files: UEPS_v1.nc
      has the same 'rpm' label on all three power variables, with active_power_total running 0
      to 930 for its 900 kW Enercon E-44 turbines (18 MW over 20), also consistent with kW. The
      units are not documented anywhere as kW. The minimum-power variable also holds 65535, an
      undeclared missing-value marker with no _FillValue attribute (2 values in UEBB_v1.nc, 45 in
      UEPS_v1.nc); mask it before use.
    evidence: https://zenodo.org/records/1475197/files/UEBB_v1.nc
    found: 2026-11-06
  - summary: Turbine locations are not in the files.
    detail: >-
      The Turbine dimension is a plain number from 1 to 32, and its comment says to refer to the
      reference material for each turbine's latitude and longitude. Matching turbines to a layout
      needs the authors' papers or a request to the authors.
    evidence: https://zenodo.org/records/1475197/files/UEBB_v1.nc
    found: 2026-11-06
notes: >-
  A one-year micrometeorological campaign at two coastal wind farms in northeast Brazil, each with
  a 100 m IEC-compliant met mast (five cup anemometer levels and a 3D sonic), turbulent fluxes, and
  at Pedra do Sal a Windcube lidar. Both NetCDF files include 10-minute SCADA (supervisory control
  and data acquisition) records for every turbine: nacelle wind speed, rotor speed and mean, min
  and max active power. Pedra do Sal has 20 Enercon E-44 turbines (55 m hub); Beberibe has 32
  Enercon E-48 turbines (75 m hub). Checked by downloading UEBB_v1.nc (163 MB): 52,560 ten-minute
  steps from 2013-08-01 00:00 to 2014-07-31 23:50, timestamps in UTC (GPS-synchronised, per the
  time variable's attributes), 32 turbines whose power series differ, about 0.25% missing. The
  Pedra do Sal file (UEPS_v1.nc, 205 MB) was not downloaded. Installed capacity per turbine is not
  in the file; rated power is in the record description only for Pedra do Sal.
