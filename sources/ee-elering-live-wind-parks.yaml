traps:
  - summary: The wind series is the API field production_renewable, which the dashboard plots as wind parks production.
    detail: >-
      /api/system returns production_renewable and a separate solar_energy_production, with no
      field named wind. The dashboard's wind parks chart ("Tuulepargid") draws
      production_renewable as "Tuuleparkide toodang" (wind parks production), and its CSV export
      is named electricity-production-wind parks. Summed for January 2024 it gives 121.8 GWh,
      close to the 115.1 GWh of wind (renewable_wind) in the monthly balance (/api/balance/total)
      and far from the 146.9 GWh of biomass, so it is wind, not all renewables.
    evidence: https://dashboard.elering.ee/8.dd45bee7bd3086737a1e.js
    found: 2026-11-06
  - summary: The time step has changed; the 5-minute grid is kept but most recent slots are empty.
    detail: >-
      Values are filled every 5 minutes in 2010 to 2018, only on the hour in 2020 to 2025, and
      every 15 minutes in 2026, with null in the other slots. Drop nulls before resampling.
    evidence: https://dashboard.elering.ee/api/system?start=2025-06-10T00:00:00.000Z&end=2025-06-10T02:00:00.000Z
    found: 2026-11-06
notes: >-
  National wind parks output in MW from GET /api/system?start=...&end=... (ISO 8601 UTC
  timestamps; responses give Unix seconds). /api/system/with-plan adds balance-provider and
  system-operator forecasts, which are not observations. The first value seen was 31 December
  2009 at 23:30 UTC, which is 1 January 2010 in Tallinn. The monthly electricity balance at
  /api/balance/total gives wind energy (renewable_wind) in GWh per month alongside hydro,
  biomass and solar, and is the better source for monthly energy totals. No installed-capacity
  series was found in the API.
