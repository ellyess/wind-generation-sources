traps:
  - summary: The monthly wind values do not add up to STATEC's own annual wind generation.
    detail: >-
      The twelve months summed to 454.9 GWh for 2024 and 85.3 GWh for 2016, while STATEC's annual
      table "Electricity generation" (DF_A4203) gives 466.8 GWh and 101.5 GWh. The gap varies from
      year to year (about 3% to 16%), so the monthly series is not a drop-in substitute for the
      annual figure; scale or check against the annual table before using it as a total.
    evidence: https://lustat.statec.lu/rest/data/LU1,DF_A4203,1.0/all?format=csvfilewithlabels
    found: 2026-11-06
  - summary: Values are in kilowatt-hours, not megawatt-hours.
    detail: For example June 2026 wind production is given as 31,813,626 kWh (31.8 GWh).
    evidence: https://lustat.statec.lu/rest/data/LU1,DSD_NRG@DF_A4102,1.0/all?format=csvfilewithlabels
    found: 2026-11-06
notes: >-
  Monthly "Wind production" in kWh for Luxembourg from January 2008 to June 2026 when checked,
  alongside hydro, thermal and combined heat and power production, imports and exports. The
  dataflow description gives STATEC as author but does not say how wind production is collected.
  The annual tables DF_A4203 (Electricity generation, from 1997 for wind) and DF_A4401
  (Renewable electricity generation by process) give annual wind in GWh, TJ and ktoe. No finer
  Luxembourg series was found from the grid operator Creos or the regulator ILR: Creos links only
  to the ENTSO-E Transparency Platform, whose Luxembourg wind series is also shown on SMARD.
