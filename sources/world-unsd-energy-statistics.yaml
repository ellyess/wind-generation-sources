traps:
  - summary: Some values are UNSD estimates, marked only by footnote 1.
    detail: >-
      The Note column carries footnote 1, "Estimate", on 125 of the roughly 2,700 wind rows read on
      the check date. Drop the footnote column and estimates become indistinguishable from
      reported figures.
    evidence: https://data.un.org/Data.aspx?d=EDATA&f=cmID%3aEW
    found: 2026-11-06
  - summary: Latest years differ by country; about a third of countries stop a year earlier than the rest.
    detail: >-
      On the check date 51 countries had 2024 and 87 stopped at 2023, with a handful ending much
      earlier. Check each country's last year before forming a cross-country total.
    evidence: https://data.un.org/Data.aspx?d=EDATA&f=cmID%3aEW
    found: 2026-11-06
notes: >-
  Annual wind electricity production in million kWh by country, from the national energy
  questionnaires UNSD runs, 1990 onward (the page points to UNSD's older Energy Statistics
  Database for earlier years, not checked). Commodity code EW. Checked by reading every page of the
  UNdata table for this commodity on the check date. The web table pages 50 rows at a time; the
  page offers CSV and XML downloads, which were not tested. Whether the figures are gross or net is
  set by the questionnaire guidelines linked as docs, which were not read for this entry.
