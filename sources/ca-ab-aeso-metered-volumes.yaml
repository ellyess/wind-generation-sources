traps:
  - summary: Columns are bare asset codes with no fuel type, so wind farms must be identified from another list.
    detail: >-
      Each column is a code such as CR1 or AKE1. AESO's asset list gives names (for example "CR1
      ARM2262 Castle River", "AKE1 McBride Lake Windfarm") but no fuel field, so wind assets have
      to be picked by name or from another register.
    evidence: http://ets.aeso.ca/ets_web/ip/Market/Reports/AssetListReportServlet?contentType=csv
    found: 2026-11-06
  - summary: Volumes for April to July 2025 were not final when released.
    evidence: https://aeso.ca/market/market-and-system-reporting/data-requests/hourly-generation-metered-volumes-and-pool-price-and-ail-data-2001-to-july-2025/
  - summary: Only generators above 5 MW are included, and an asset's column is blank before it existed.
    detail: >-
      The column set changes between the three files (2001-2009, 2010-2019, 2020-July 2025).
      Blank means not yet registered; zero means registered and not generating.
    evidence: https://aeso.ca/market/market-and-system-reporting/data-requests/hourly-generation-metered-volumes-and-pool-price-and-ail-data-2001-to-july-2025/
    found: 2026-11-06
notes: >-
  Hourly metered volumes per generating asset in Alberta, 1 January 2001 to 31 July 2025, in three
  CSVs, with GMT and local time columns, pool price and Alberta internal load. Checked per asset:
  the Castle River wind farm (CR1) has values from the first hour of 2001, and in January 2020
  CR1, McBride Lake (AKE1) and Blue Trail (BTR1) give different series. For data after July 2025,
  AESO's API page lists a Metered Volume Report; its access terms were not checked. Turbine
  locations are in Natural Resources Canada's Canadian Wind Turbine Database, a separate source.
