  evidence: "https://bmrs.elexon.co.uk/api-documentation/endpoint/datasets/FUELHH"
  note: >-
    Elexon describes FUELHH as "average MW values over 30 minutes". Rows carry startTime in UTC
    (2024-01-15T23:30:00Z for settlement period 48, published at 2024-01-16T00:00:00Z) alongside
