traps:
  - summary: Wind energy excludes curtailed output, so it runs below what the fleet could produce.
    detail: >-
      Every wind table and chart carries the note "Wind and solar PV energy excludes curtailment
      and is thus lower than actual wind and solar PV generation". The curtailed amount is not
      given. Found by an automated research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.csir.co.za/sites/default/files/2025-09/Utility%20Statistics%20Report_Jan%202025_Final.pdf
    found: 2026-11-08
  - summary: The generation table uses a decimal comma, while the charts use a decimal point.
    detail: >-
      The page 8 table prints 2024 wind as "11,1" TWh (coal "177,9"); the chart on the same page
      labels it "11.1". A parser that treats the comma as a thousands separator reads 111. Found by
      an automated research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.csir.co.za/sites/default/files/2025-09/Utility%20Statistics%20Report_Jan%202025_Final.pdf
    found: 2026-11-08
  - summary: Only utility-scale wind is counted; embedded and private plants are left out.
    detail: >-
      The capacity page says installed capacity excludes "embedded generation capacity and private
      capacity". The wind figure is Eskom's Sere farm (100 MW) plus the plants under the renewable
      independent power producer programme (3,443 MW operational at 30 June 2024). Wind built
      outside these, for example for private offtake, is not in the series. Found by an automated
      research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.csir.co.za/sites/default/files/2025-09/Utility%20Statistics%20Report_Jan%202025_Final.pdf
    found: 2026-11-08
notes: >-
  A yearly slide report by the CSIR, compiled from Eskom data ("Sources: Eskom; CSIR analysis";
  Eskom's data portal is the first reference). For wind it gives the calendar-year energy (11.1 TWh
  in 2024, 11.6 TWh in 2023, back to 2014 in a chart), operational capacity (3,443 MW), monthly
  energy as GWh labels on a stacked chart (hard to assign to a series from the text layer) and
  monthly capacity factors. The same file is also served at
  https://www.csir.co.za/sites/default/files/2025-11/UtilityStatisticsReportJan2025Final.pdf
  (byte-identical on the check date). Earlier editions were not checked. Stats SA, which publishes
  a national wind figure too, refused automated requests (an Incapsula bot check) on the check
  date.
status: active
last_checked: 2026-11-08
