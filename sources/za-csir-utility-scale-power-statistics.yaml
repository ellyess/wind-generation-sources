id: za-csir-utility-scale-power-statistics
name: Utility-scale power generation statistics in South Africa, annual wind energy
publisher: Council for Scientific and Industrial Research (CSIR), Energy Research Centre
publisher_role: research
countries: [ZA]
area: >-
  South Africa's utility-scale fleet: Eskom plus the independent power producers it contracts.
  Embedded generation and private capacity are excluded.
level: country
technology: onshore
measure: reported-generation
resolution: annual
coverage:
  start: 2014
  update: annual (the 2024 report was dated 17 March 2025)
capacity: included
coordinates: none
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: TWh
  value: period-total
  evidence: https://www.csir.co.za/sites/default/files/2025-09/Utility%20Statistics%20Report_Jan%202025_Final.pdf
  note: >-
    The 2024 report's title page gives its period as "1 January 2024 – 31 December 2024", and the
    page 8 table of annual generation is in TWh by calendar year (wind "11,6" in 2023 and "11,1" in
    2024). The chart "Annual energy produced [TWh]" gives wind for each calendar year from 2014.
    Monthly wind appears only as GWh data labels on a stacked chart. Read 2026-11-08 by an
    automated research pass; not yet reviewed.
