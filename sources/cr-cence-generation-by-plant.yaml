traps:
  - summary: The data come from the system operator's real-time SCADA and are not commercial metering; the latest two months are provisional.
    detail: >-
      Every generation service in the catalogue says "Datos adquiridos en tiempo real por medio del
      SCADA del DOCSE. No son obtenidos de medición comercial" and "Los datos del mes actual y del
      mes anterior están en proceso de revisión". Re-download recent months before using them, and
      use cr-cence-monthly-energy-by-plant (officialised monthly energy) for totals.
    evidence: https://apps.grupoice.com/CenceWeb/data/servicios/json/WebServices/
    found: 2026-11-06
  - summary: The CSV downloads are Latin-1 (ISO-8859-1) encoded, so "Eólico" is garbled if read as UTF-8.
    detail: >-
      The byte for "ó" in the CSV is 0xF3. Read with encoding="latin-1", or use the JSON endpoint,
      which is UTF-8.
    evidence: https://apps.grupoice.com/CenceWeb/data/sen/csv/PotenciaFuentePlanta?fecha=20260215&intervalo=15&planta=Chiripa
    found: 2026-11-06
  - summary: The hourly per-plant energy service has only ICE's own wind plant (Tejona) before 2014, while the 15-minute power service has the private plants from 2010.
    detail: >-
      EnergiaHorariaFuentePlanta for 15 June 2013 lists only Tejona under "Eólica"; for 1 January
      2014 it lists eight wind plants. PotenciaFuentePlanta for 15 June 2010 already lists
      Aeroenergía, MOVASA, PEG, Plantas Eólicas and Tejona. For 2010-2013 use the 15-minute
      service.
    evidence: https://apps.grupoice.com/CenceWeb/data/sen/json/EnergiaHorariaFuentePlanta?anno=2013&mes=6&dia=15
    found: 2026-11-06
notes: >-
  Costa Rica's system operator publishes free, keyless web services behind its CENCE pages. Two
  give wind output per plant. PotenciaFuentePlanta (parameters fecha=YYYYMMDD, intervalo=15, 30 or
  60) returns MW per plant and per unit for one day; for 15 February 2026 it returned 96
  fifteen-minute values for each of 19 wind plants (Tejona as two units). EnergiaHorariaFuentePlanta
  (parameters anno, mes, dia, optional planta) returns hourly MWh per plant for one day; the plant
  filter was checked (Chiripa 763.3 MWh and Orosí 831.6 MWh on 15 February 2026, an unknown plant
  name returns nothing). The JSON, CSV and XML forms differ only in the path
  (/CenceWeb/data/sen/json/..., /csv/..., /xml/...). History checked by request: 15-minute power
  starts between 15 May and 15 June 2010 (earlier dates return only 48 half-hourly rows for one
  hydro plant); hourly energy starts in September 2012. Rows carry a "grupo" field (ICE, BOT,
  private, other) and the plant name, but no plant code or coordinates. "Plantas Eólicas" is the
  name of one private plant, not a total. Installed capacity per plant, in kW with unit counts, is
  in the CapacidadInstalada service, which only covers dates from 1 January 2023; at 1 November
  2026 it listed 17 wind plants and did not list Tejona or PE Tilarán, although both still appear
  in the generation series. Timestamps have no zone; the response's own query time is given with a
  -0600 offset, so local time at UTC-6 is likely. Whether hourly values are labelled by the start or
  end of the hour is not documented.
