area: >-
  The 27 member countries named on OLACDE's member page. Which of them have a wind generation
  series was not checked, because the database needs a login.
level: country
technology: onshore-and-offshore-combined
measure: reported-generation
resolution: annual
coverage:
  start: 1970
  update: annual (the 2024 data were added on 8 December 2025, per the "About the data" note)
capacity: included
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: unknown
  value: unknown
  evidence: https://sielac.olacde.org/
