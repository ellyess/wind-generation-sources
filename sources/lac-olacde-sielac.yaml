id: lac-olacde-sielac
name: sieLAC Energy Information System of Latin America and the Caribbean (Sistema de Información Energética de Latinoamérica y el Caribe)
publisher: OLACDE (formerly OLADE, the Latin American Energy Organization)
publisher_role: statistics-office
