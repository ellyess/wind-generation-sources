traps:
  - summary: Recent wind values are a projection from weather data, not measurements, until the month after.
    detail: >-
      APG says wind figures are partly projected from meteorological data and are usually
      replaced with measured generation on the 28th day of the following month, after the first
      clearing. A download taken before then holds modelled wind for the latest weeks.
    evidence: https://markt.apg.at/en/transparency/generation/generation-per-production-type/
    found: 2026-11-06
  - summary: The API refuses any date before 2023; older years are only in a separate ZIP archive.
    detail: >-
      Requests from before 2023 return "fromlocal may not be before 2023. If you need these
      values use the download archives". APG states that data up to 31 December 2022 are only in
      the download section (an 18 MB ZIP on the Generation per production type page).
    evidence: https://transparency.apg.at/api/v1/AGPT/Data/English/PT15M/2015-01-15T000000/2015-01-16T000000
    evidence_is_error: true
    found: 2026-11-06
  - summary: The "Settlement" quality option returned only missing values.
    detail: >-
      The site and API offer two qualities, newest and settlement. Settlement returned every
      quarter hour flagged missing for days tried in 2023, 2024, 2025 and 2026, so use the
      newest values and track their revisions yourself.
    evidence: https://transparency.apg.at/api/v1/AGPT/Data/English/PT15M/2024-01-15T000000/2024-01-16T000000?p_agptMode=settlement&resolution=PT15M
    found: 2026-11-06
  - summary: The area covered grew in 2011 and 2012, which steps the series.
    detail: >-
      The Tyrolean grid area is included from 2011, and from 2012 the APG control area covers
      all of Austria except a corridor in Vorarlberg. Do not compare totals across that change
      without adjusting.
    evidence: https://markt.apg.at/en/transparency/generation/generation-per-production-type/
    found: 2026-11-06
  - summary: On the autumn clock-change day the CSV writes the repeated hour as "2A" and "2B", which date parsers reject.
    detail: >-
      The quarter-hour download for 27 October 2024 has 100 rows. After "2024-10-27
      01:45:00,2024-10-27 2A:00:00,684.000" come four rows from "2024-10-27 2A:00:00" and four
      from "2024-10-27 2B:00:00,2024-10-27 2B:15:00,488.000" (time from, time to, wind MW), then
      "2B:45:00" to "03:00:00". 26 October 2025 is the same. A strict parser fails on these rows
      and a lenient one may drop them. Map 2A to 02 at UTC+02:00 and 2B to 02 at UTC+01:00
      before parsing. The spring day has 92 rows and needs no special handling. Found by an
      automated research pass on 2026-11-07; not yet reviewed by a person.
    evidence: https://transparency.apg.at/api/v1/AGPT/Download/English/PT15M/2024-10-27T000000/2024-10-28T000000
    found: 2026-11-07
notes: >-
  Net feed-in by production type in the APG control area, in MW per quarter hour (hourly also
  offered), published under EU Regulation 543/2013 article 16.1.b, so it matches the ENTSO-E
  "actual generation per type" category; wind is the column with code B19 (Wind Onshore).
  Checked by requesting days in 2023, 2024, 2025 and 2026 and seeing different values. API
  requests must start and end at midnight and use PT15M or PT60M. Installed capacity per
  production type has its own visualisation on the same site. The 2011 start is inferred from
  APG's note that the Tyrolean area was included from 2011; the historical ZIP was not opened,
  so the true first year was not checked.
status: active
