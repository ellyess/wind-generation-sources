id: at-apg-transparency
name: APG market transparency, Generation per production type
publisher: Austrian Power Grid (APG)
publisher_role: tso
countries: [AT]
area: APG control area, all of Austria except a corridor in Vorarlberg (since 2012)
level: country
technology: onshore
measure: reported-generation
resolution: 15min
coverage:
  start: 2011
  update: near real time, about one hour behind; wind replaced by metered values on the 28th of the following month
capacity: separate-dataset
coordinates: not-applicable
curtailment: unknown
conventions:
  timezone: Europe/Vienna
  timestamp: period-start
  unit: MW
  value: unknown
  evidence: "https://transparency.apg.at/api/v1/AGPT/Download/English/PT15M/2024-10-27T000000/2024-10-28T000000"
  note: >-
    The CSV download heads its first two columns "Time from [CET/CEST]" and "Time to [CET/CEST]"
    and the wind column "Wind Onshore [MW] (newest value)", so each row carries both ends of its
    quarter hour in Austrian local time; this entry records the "Time from" column. The JSON API
    gives the same pair as DF/TF and DT/TT. On the autumn change day the repeated hour is written
    "2A" and "2B" (for example "2024-10-27 2A:15:00"), which ordinary date parsers reject; the
    spring change day has 92 quarter hours, jumping from 01:45 to 03:00. Neither the page nor the
    file says whether the MW value is the quarter-hour mean or a reading; the page calls them
    quarter-hourly feed-in values from the meters. Read 2026-11-06 by an automated research pass;
    not yet reviewed.
