traps:
  - summary: Output of small unlicensed plants is calculated from installed capacity, not measured.
    detail: >-
      The report says data for unlicensed plants connected to distribution grids are the
      installed capacity, with production computed from it using data reported to the market
      operator.
    evidence: https://eru.gov.cz/sites/default/files/obsah/prilohy/eruelektroq22026.pdf
    found: 2026-11-06
  - summary: Renewable plants above 100 kW not yet registered with the market operator are left out, and figures are revised in later reports.
    detail: >-
      At 30 June 2026 this excluded 7.1 MW of wind. The report says corrections and late data are
      carried into the next published reports, so a quarter's figures change when the annual
      report comes out.
    evidence: https://eru.gov.cz/sites/default/files/obsah/prilohy/eruelektroq22026.pdf
    found: 2026-11-06
notes: >-
  Monthly gross and net wind (VTE) production in MWh and GWh, with installed capacity in MW
  split by plant size (up to 0.5 MW, 0.5 to 1 MW, 1 to 2 MW, above 2 MW), plus a regional (kraj)
  breakdown of wind capacity and production. Checked in the Q2 2026 report (wind 58.3, 41.8 and
  34.7 GWh gross in April, May and June 2026, on 374.9 to 379.1 MW) and the February 2014 monthly
  report. Until about 2015 ERÚ published monthly reports (file names meszprMMYYYY.pdf); now
  quarterly reports in PDF and XLSX cover each month of the quarter, and an annual report
  closes the year. All data come from licence holders: generators, distribution and
  transmission operators and the market operator (OTE).
