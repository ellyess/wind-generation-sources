id: se-svk-mimer-production
name: Mimer production statistics per bidding zone, wind power (Produktionsstatistik, Vindkraftproduktion)
publisher: Svenska kraftnät (Swedish transmission system operator)
publisher_role: tso
countries: [SE]
area: Sweden as a whole and bidding zones SE1, SE2, SE3 and SE4
level: zone
technology: onshore-and-offshore-combined
measure: metered-energy
resolution: hourly
coverage:
  start: 2015
  end: 2025
  update: none; production statistics moved to eSett Open Data, and the last non-zero hour is in October 2025
capacity: none
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: unknown
  timestamp: unknown
  unit: kWh
  value: period-total
  evidence: https://www.svk.se/om-kraftsystemet/kraftsystemdata/elstatistik/beskrivning-av-statistiken/
  note: >-
    Mimer heads the value "Avräknad (kWh)" (settled), and Svenska kraftnät says the statistics are
    built from metered hourly energy values reported to imbalance settlement, so each value is one
    hour's energy. Neither Mimer nor the description page states the time zone or whether a label
    starts or ends its hour. The entry's trap derives Swedish standard time (UTC+1 all year) with
    hour-start labels by matching Mimer to eSett's UTC quarter hours; that is a data comparison, not
    a publisher statement. Read 2026-11-06 by an automated research pass; not yet reviewed.
    Rechecked 2026-11-07 against eSett for a summer and a winter hour (both match as UTC+1,
    hour-start), with 24 rows on each clock-change day; the description page still states no zone,
    so both fields stay unknown here.
