traps:
  - summary: The turbine is behind the meter, and a gearbox change left no output for ten months.
    detail: >-
      The record says the turbine supplies the campus behind the meter and that no positive
      power was produced from 4 October 2018 to 27 July 2019 during a gearbox changeout. 2010 also
      has only about a third of a year's rows.
    evidence: https://data.mendeley.com/datasets/tm988rs48k/2
    found: 2026-11-06
  - summary: The power column holds impossible spikes and some timestamps repeat.
    detail: >-
      Power ranges from -3,275 to 3,149 kW, while 99.9% of rows lie between -3 and 851 kW; 14 rows
      exceed 1,000 kW and 51 are below -100 kW, so outliers need removing. Twenty
      timestamps appear twice (daytime, on scattered dates such as 2014-10-23), and the generator
      temperature column holds 999 as a fill value. The time zone is not stated; no daylight-saving
      gaps or repeats were seen in late March.
    evidence: https://data.mendeley.com/datasets/tm988rs48k/2
    found: 2026-11-06
notes: >-
  Fourteen years of raw 10-minute SCADA (supervisory control and data acquisition) data from one
  peri-urban turbine (60 m hub, 52 m rotor) at 53.98352 N, 6.39139 W: mean, min, max and standard
  deviation of power, wind speed and direction, pitch, speeds and temperatures, in one xlsx sheet
  of 653,103 rows with a parameter description PDF. Checked by downloading the workbook. Rated
  power is not stated in the record; output tops out near 851 kW. A rare long single-turbine
  record for power-curve drift and reanalysis checks at one site.
