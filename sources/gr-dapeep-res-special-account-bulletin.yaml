id: gr-dapeep-res-special-account-bulletin
name: Monthly bulletin of the special account for renewables, CHP and storage (Μηνιαίο Απολογιστικό Δελτίο Ειδικού Λογαριασμού ΑΠΕ, ΣΗΘΥΑ & Αποθήκευσης)
publisher: DAPEEP (Διαχειριστής ΑΠΕ & Εγγυήσεων Προέλευσης, Greek renewables and guarantees of origin operator)
publisher_role: government
countries: [GR]
area: Interconnected system, and separately the whole territory including non-interconnected islands
level: country
technology: onshore
measure: reported-generation
resolution: monthly
coverage:
  start: 2013
  update: monthly, about three to four months after the month (June 2026 published 8 October 2026)
capacity: included
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: GWh
  value: period-total
  evidence: "https://www.dapeep.gr/wp-content/uploads/2026/10/39_JUNE_2026_min_DELTIO_ELAPE_v_1.0_8.10.2026.pdf"
  note: >-
    The June 2026 bulletin's monthly table gives MW and GWh per technology for each month (Ιαν
    to Δεκ) and a year total. Numbers use the Greek format, a point for thousands and a comma
    for decimals, so "1.478" GWh for January wind is 1,478 GWh. Read 2026-11-06 by an automated
    research pass; not yet reviewed.
