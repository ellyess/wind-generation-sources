id: bg-nsi-monthly-electricity-production
name: Production and deliveries of electricity, monthly (Energy 1.4)
publisher: National Statistical Institute of Bulgaria (NSI)
publisher_role: statistics-office
countries: [BG]
level: country
technology: onshore
measure: reported-generation
resolution: monthly
coverage:
  start: 2026
  update: monthly, about two months after the reference month (August 2026 was released 30 October 2026)
capacity: none
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: GWh
  value: period-total
  evidence: https://www.nsi.bg/sites/default/files/files/metadata/Energy-1.4.Methodology_en.pdf
  note: >-
    Columns are labelled by year and Roman-numeral month (2026, I to VIII), with "GWh" in the
    Measure column of each row. The methodological notes define net production as electricity
    measured at the output of the power station (gross production minus the station's own
    needs), reported by energy product including wind. The wind row is an "of which" row of net
    production: in January 2026 the nine products sum to 3,770 GWh, the net production figure.
    Read 2026-11-08 by an automated research pass; not yet reviewed.
