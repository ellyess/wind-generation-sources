traps:
  - summary: Wind is separated only from January 2026; earlier months in the same file are "x" (not applicable).
    detail: >-
      In the workbook downloaded on 2026-11-08 the "2024-2026" sheet gives gross and net
      production for every month from January 2024, but all the "of which" rows, wind
      included, are "x" for 2024 and 2025, and the "2019" sheet has no fuel split at all. The
      monthly wind series is therefore eight months long (January to August 2026, 177 GWh to
      47 GWh). Found by an automated research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.nsi.bg/sites/default/files/files/data/timeseries/Energy-1.4.Electricity_en.xlsx
    found: 2026-11-08
  - summary: Wind is net production, so it will read slightly below gross wind series from other publishers.
    detail: >-
      The wind row sits under net production, which the methodology defines as gross minus the
      station's own needs. Compare it with net figures, not with gross annual statistics.
      Found by an automated research pass on 2026-11-08; not yet reviewed by a person.
    evidence: https://www.nsi.bg/sites/default/files/files/metadata/Energy-1.4.Methodology_en.pdf
    found: 2026-11-08
notes: >-
  Monthly national electricity production in GWh (gross, net, and net by product: nuclear, coal,
  petroleum products, natural gas, combustible renewables, hydro, wind, solar photovoltaic,
  other), imports, exports and net consumption, as an English and a Bulgarian workbook
  (Energy-1.4.Electricity_en.xlsx and Energy-1.4.Electricity.xlsx) and as monthly press-release
  PDFs ("Production and deliveries of energy products"). Checked 2026-11-08: wind 177 GWh in
  January, 144 in February, 115 in March, 86 in April, 117 in May, 47 in June, 76 in July and 83
  in August 2026. The short span is the point: this is the only monthly official wind figure for
  Bulgaria found so far, alongside ESO's hourly page (bg-eso-generation-per-day).
