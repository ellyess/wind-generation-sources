id: us-nyiso-fuel-mix
name: Real-Time Fuel Mix (rtfuelmix)
publisher: New York Independent System Operator (NYISO)
publisher_role: iso-rto
countries: [US]
area: New York State control area
level: zone
technology: onshore-and-offshore-combined
measure: reported-generation
resolution: 5min
coverage:
  start: 2015
  update: near real time (daily file), with monthly zip archives
capacity: none
coordinates: not-applicable
curtailment: not-reported
access:
  method: bulk-download
  url: https://www.nyiso.com/energy-market-operational-data
  key_required: false
