  update: near real time (daily file), with monthly zip archives
capacity: none
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: America/New_York
  timestamp: unknown
  unit: MW
  value: unknown
  evidence: https://mis.nyiso.com/public/csv/rtfuelmix/20261105rtfuelmix.csv
  note: >-
    Columns are "Time Stamp", "Time Zone" (EST or EDT) and "Gen MW" (headed "Gen MWh" in the
    December 2015 files). Neither the file nor the NYISO pages checked say whether a stamp marks the
    start or end of a five-minute interval, or whether a value is an average or a snapshot; the
    first stamp of a day is 00:05. The entry's trap calls the values instantaneous, which was not
    confirmed on a NYISO page. Read 2026-11-06 by an automated research pass; not yet reviewed.
    Rechecked 2026-11-07: the Market Participants User's Guide (version 18.0, effective
    18 September 2026) does not mention the fuel mix, so the trap no longer calls the values
    instantaneous. Stamps are not always on the five-minute grid: 5 November 2026 has 294 wind
    rows, with extra stamps such as 08:09:45, 08:50:21 and 08:50:27 between the regular ones.
