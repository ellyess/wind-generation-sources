conventions:
  timezone: Asia/Colombo
  timestamp: unknown
  unit: MW
  value: unknown
  evidence: https://www.pucsl.gov.lk/daily-generation-reports-2/
  note: >-
    The monthly 15-minute workbooks ("Actual System Dispatch") label columns 0:15 to 0:00 in
    Sri Lanka time (UTC+5:30, no daylight saving), with values in MW; they do not say whether a
    value is a mean or a reading, or which end of the 15 minutes a label marks. The run from
    0:15 to 0:00 suggests period ends. The portal's own data calls return the same values in
    UTC (dispatchValueInMW; 2024-04-01 0:15 is 2024-03-31T18:45Z, 25 MW in both). Daily totals
    are MWh per local day, stamped at local midnight (reportDate 18:30Z the day before).
    2016 to 2018 hold values every 30 minutes only. Read 2026-11-08 by an automated research
    pass; not yet reviewed.
