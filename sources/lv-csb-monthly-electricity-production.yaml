traps:
  - summary: Monthly wind output is published in whole million kWh (GWh), so small months carry large rounding error.
    detail: >-
      Values are integers, for example 3 GWh in February 2006 and 15 GWh in September 2025;
      before about 2015 a month's rounding error can exceed 10 per cent.
    evidence: https://data.stat.gov.lv/pxweb/en/OSP_PUB/START__NOZ__EN__ENB/ENB010m/
    found: 2026-11-06
notes: >-
  Indicator WT ("..wind turbines") is gross electricity production from wind in million kWh per
  month, January 2006 to September 2026 when checked. September 2026 (51) matches the 51 GWh in
  AST's monthly market overview. Installed wind capacity in MW, with annual gross production
  from 1990, is in table ENA040 (Electrical capacity and produced electricity from renewables).
  Queried through the PxWeb API (POST with a JSON query to
  https://data.stat.gov.lv/api/v1/en/OSP_PUB/START/NOZ/EN/ENB/ENB010m). Latvia has no
  offshore wind, so the series is onshore.
