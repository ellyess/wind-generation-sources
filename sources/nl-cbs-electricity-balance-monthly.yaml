traps:
  - summary: Recent figures are provisional and are revised for up to two years.
    detail: >-
      The table description (6 November 2026) lists 2023 as definitive, 2024 and 2025 as
      revised provisional ("nader voorlopig") and 2026 as provisional. Record the download date
      with any result.
    evidence: https://opendata.cbs.nl/ODataApi/odata/84575NED/TableInfos
    found: 2026-11-06
  - summary: Monthly rows start in 1976, but the wind columns are empty before 2002 and offshore is empty before October 2006.
    detail: >-
      Filter on periods ending in MM (month codes such as 2026MM08); the same table also holds
      quarterly and yearly rows. Empty means not published, not zero.
    evidence: https://opendata.cbs.nl/ODataApi/odata/84575NED/TypedDataSet?$select=Perioden,WindenergieOpLand_13,WindenergieOpZee_14
    found: 2026-11-06
notes: >-
  Net electricity production by source per month, with wind split into onshore
  (WindenergieOpLand_13) and offshore (WindenergieOpZee_14), in million kWh (GWh). Checked via
  the OData API on 6 November 2026: January 2002 onshore 113 GWh; August 2026 onshore 959 and
  offshore 920 GWh. The wind columns sit under net production; the table also gives gross
  production for all sources combined. It succeeds table 70802ned (wind per month 2002 to June
  2019, onshore and offshore split, with a wind index), which was discontinued in 2019 and is
  still downloadable. Installed capacity per province (onshore) is in table 70960ned
  (nl-cbs-onshore-wind-by-province).
