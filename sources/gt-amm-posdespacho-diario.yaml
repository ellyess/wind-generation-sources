traps:
  - summary: The hour column mixes whole hours 1 to 24 with extra quarter-hour readings around the peaks, written as decimals such as 11.3, 18.15 and 20.45.
    detail: >-
      On 15 February 2026 the sheet has 34 rows: hours 1 to 24 plus rows labelled 11.3, 18.15,
      18.3, 18.45, 19.15, 19.3, 19.45, 20.15, 20.3 and 20.45 (that is 11:30, 18:15 and so on). Keep
      only whole-number labels to get an hourly series. The row above hour 1 holds a daily figure
      per unit that is close to, but not equal to, the sum of the 24 hourly values (LCU-E 60.425
      against 63.93 on 15 February 2026).
    evidence: https://www.amm.org.gt/pdfs2/post_despacho/POSDESPACHO_DIARIO/2026/02_FEBRERO/PD20260215.zip
    found: 2026-11-06
  - summary: Unit columns move from day to day and the file format changed from .xls to .xlsx, so columns must be found by unit code.
    detail: >-
      The wind unit SNT-E is column 44 on 15 September 2015, 46 on 15 February 2016 and 65 on 15
      February 2020. Files up to at least 2016 are Excel 97 (.xls) inside the zip; 2020 and later
      are .xlsx. Wind units carry the suffix "-E" (SNT-E, VBL-E, LCU-E).
    evidence: https://www.amm.org.gt/pdfs2/post_despacho/POSDESPACHO_DIARIO/2016/02_FEBRERO/PD20160215.zip
    found: 2026-11-06
notes: >-
  Guatemala's market operator publishes one zip per day containing the post-dispatch workbook.
  Its "Carga Horaria" sheet ("Carga Horaria digitada en el CDC", hourly load recorded at the
  dispatch centre) gives MW for every generating unit, about 150 columns including imports and
  exports, with a "Total Generado" and "Demanda SNI" column. The sheet does not say whether each
  hourly value is an average or a reading at the hour; hours are numbered 1 to 24. Daily files
  are at https://www.amm.org.gt/pdfs2/post_despacho/POSDESPACHO_DIARIO/YYYY/MM_MONTHNAME/PDYYYYMMDD.zip
  (Spanish month in capitals, for example 02_FEBRERO); the portal's report selector builds the
  same path for dates from August 2012. Wind units checked: SNT-E only in 2015 (zero on 15 March
  2015, 93.1 on 15 September 2015); SNT-E and VBL-E in 2016; SNT-E, VBL-E and LCU-E in 2020 and 2026,
  with different hourly profiles (15 February 2020 daily figures 1,180.65, 540.4 and 624.575). The
  unit codes are not expanded in the post-dispatch sheet; AMM's daily dispatch programme for the
  same day (https://www.amm.org.gt/pdfs2/programas_despacho/01_PROGRAMAS_DE_DESPACHO_DIARIO/2026/01_PROGRAMAS_DE_DESPACHO_DIARIO/02_FEBRERO/WEB15022026.xlsx)
  lists them under "EOLICO" as San Antonio El Sitio (SNT-E1), Las Cumbres (LCU-E) and Viento
  Blanco (VBL-E). AMM also runs a Knowage statistics
  portal (https://reportesbi.amm.org.gt/knowage/) and dynamic reports, not checked in this pass.
