  note: >-
    The workbook's index names the sheet 'Lecturas de carga horaria' (hourly load readings) and the
    sheet itself reads 'Carga Horaria digitada en el CDC' (entered at the dispatch centre); with the
    extra quarter-hour rows around the peaks (11.3, 18.15 and so on) the pass read this as readings
    taken at each hour, not hourly averages, though AMM does not say so. Hours are numbered
    1 to 24. The sheet prints no unit; the 'Curva S.N.I.' sheet takes its 'Demanda Maxima S.N.I.
    (MW)' from it, so the values are MW. No time zone is stated. Read 2026-11-06 by an automated
    research pass; not yet reviewed. Changed 2026-11-07: the pass had set timestamp 'instant' and
    value 'instantaneous' from the label alone, but "lecturas" (readings) does not say whether a
    reading is a snapshot or an hour's average, and no AMM page found defines it, so both are now
    unknown. The data do not settle it either: on 15 February 2026 the daily row above hour 1 is
    within a median 0.55 per cent of the plain sum of the 24 hourly values and 1.2 per cent of a
    trapezoid through the readings (using 14 February's hour 24 as midnight), the plain sum being
    closer for 49 of 88 units, so neither reading fits exactly (SNT-E: daily 166, sum 164.99,
    trapezoid 140.4).
