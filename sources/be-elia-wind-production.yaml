id: be-elia-wind-production
name: Wind power production estimation and forecast on Belgian grid (Elia Open Data ods031)
publisher: Elia
publisher_role: tso
countries: [BE]
level: zone
technology: onshore-and-offshore-split
measure: estimated-generation
resolution: 15min
coverage:
  start: 2015
  update: daily (on 2026-11-08 the last record was 2026-11-06 22:45 UTC)
capacity: included
coordinates: not-applicable
curtailment: reported
conventions:
  timezone: UTC
  timestamp: period-start
  unit: MW
  value: period-mean
  evidence: "https://opendata.elia.be/api/explore/v2.1/catalog/datasets/ods031"
  note: >-
    The dataset's field metadata define datetime as "Time at which the interval starts" (displayed
    in local time on the portal, UTC in downloads and the API, which returns "+00:00"), and the
    measured field as "The value running average measured for the reported time interval", unit
    MW. The description repeats that measured and forecast values are in MW. The loadfactor field
    is described as a percentage, but the values read are fractions (0.3 for 21.2 MW of 70.35 MW
    monitored). Read 2026-11-06 by an automated research pass; not yet reviewed.
access:
  method: api
  url: https://opendata.elia.be/explore/dataset/ods031/information/
  key_required: false
  registration: false
  formats: [csv, json, parquet, xlsx]
licence:
  name: Elia Open Data Licence (CC BY 4.0 under Belgian law)
  spdx: CC-BY-4.0
  url: "https://opendata.elia.be/pages/licence/"
  redistribution: allowed-with-attribution
  attribution: Elia Transmission Belgium SA
  verified: true
traps:
  - summary: Elia's own notice says offshore "measured and upscaled" values differ from validated metering by 100-300 MW per quarter-hour, about 10% of the time in 2018-2023.
    detail: >-
      The series is upscaled from measurements, not fully metered, and Elia states it is still
      investigating the offshore deltas. Treat offshore quarter-hours in that period with care.
    evidence: https://opendata.elia.be/explore/dataset/ods031/information/
    found: 2026-11-06
  - summary: Rows are split by onshore or offshore, region and grid connection (Elia or distribution grid), so a national total is a sum over rows.
    detail: >-
      Sum output and monitored capacity over the same rows in each interval before dividing, so
      both describe the same fleet.
    evidence: https://github.com/ellyess/PyVWF/blob/archive/research-2026-10-27/docs/runbooks/entsoe.md
  - summary: Times display in local time on the portal but are UTC in downloads and the API.
    evidence: https://opendata.elia.be/explore/dataset/ods031/information/
    found: 2026-11-06
  - summary: The load factor is described as a percentage but stored as a fraction, and it sometimes exceeds 1.
    detail: >-
      The field metadata describe loadfactor as "The percentage ratio between measured power
      generation and the total monitored power capacity", with no unit. The values are fractions:
      at 2024-01-15T12:00:00+00:00 the federal offshore row reads measured 1912.18, monitored
      capacity 2262.1, loadfactor 0.85, and the Wallonia distribution-grid onshore row reads
      311.66, 1093.35, 0.29. Multiply by 100 if a percentage is wanted, and recompute a national
      figure from summed output and capacity rather than averaging this field. Across the whole
      dataset loadfactor runs from -0.12 to 2.58, with 786 rows above 1: for Flanders
      Elia-connected onshore at 2018-03-01 22:45 UTC, measured is 138.75 MW against 53.86 MW of
      monitored capacity. Check such rows before using them. Found by an automated research pass
      on 2026-11-07; not yet reviewed by a person.
    evidence: "https://opendata.elia.be/api/explore/v2.1/catalog/datasets/ods031/records?limit=10&select=datetime,offshoreonshore,region,gridconnectiontype,measured,monitoredcapacity,loadfactor&where=datetime%3Ddate%272024-01-15T12%3A00%3A00%2B00%3A00%27"
    found: 2026-11-07
notes: >-
  Measured-and-upscaled output with monitored capacity and a load factor every 15 minutes, plus
  Elia's forecasts with P10 and P90. A decremental-bid field marks quarter-hours when Elia asked
  a park to reduce output, though Elia publishes no detail on bids at the owners' request. The
  dataset's first record is 31 December 2014, 23:00 UTC. A better national series for Belgium
  than ENTSO-E's per-type data, which needs onshore and offshore added correctly.
  Added 2026-11-08: coverage.update was missing. The API's latest record on 2026-11-08 was
  2026-11-06T22:45:00+00:00, and the dataset is now titled "(Historical)".
status: active
last_checked: 2026-11-08
checked_by: Ellyess Benmoufok and Claude Code; dataset metadata read via the Opendatasoft API; licence read on the publisher's page 2026-11-06; links and conventions re-checked by an automated pass 2026-11-08
