  evidence: https://rtdwweb.mavir.hu/rtdwweb/webuser/GenerateChartsServlet?hunLang=hu-hu&tabId=tab11841
  note: >-
    The chart embedded on MAVIR's page has its y-axis in MW; the xlsx export headers carry no unit.
    Each exported stamp (column 'Időpont') carries its UTC offset, for example '2026.11.02 00:15:00
    +0100', so stamps are Hungarian local time. MAVIR does not say whether a stamp marks the start
    or end of the quarter hour, or whether a value is a quarter-hour average; the first stamp of a
    day is 00:15, which suggests period end, but that is read from the data, not documented. The
    chart's user-guide button says no guide exists for it. Read 2026-11-06 by an automated research
    pass; not yet reviewed. Rechecked 2026-11-07: a midnight-to-midnight request returns 00:15 to
    24:00, and 26 October 2025 has 100 stamps, so the stamp end stays unknown here but the data fit
    period end.
