id: ch-pronovo-guarantees-of-origin-raw-data
name: "HKN-Cockpit raw data: guarantee-of-origin transactions for electricity (HKN-Cockpit Rohdaten)"
publisher: Pronovo AG
countries: [CH]
level: country
technology: onshore
measure: certificates
resolution: monthly
coverage:
  start: 2024
  update: >-
    annual file per year, replaced when re-run (the 2025 file is listed as 06.02.2026 but the
    archive downloaded on 2026-11-08 was evaluated on 08.07.2026)
capacity: none
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: kWh
  value: period-total
  evidence: https://pronovo.ch/de/herkunftsnachweise/information/prozess-erfassung-bis-entwertung/
  note: >-
    The column header names the quantity "Issued(kWh)", and each row carries a production month
    (Produktionsmonat, for example "1.2025" or "04.2025"). Pronovo's process page says plants
    over 30 kVA must report production monthly, from a remotely read meter, by the end of the
    following month, and that guarantees of origin are issued for the produced quantity; so an
    issued row is metered energy for a calendar month. Small plants may report per month,
    quarter or year; how those appear in the file is not stated. Read 2026-11-08 by an
    automated research pass; not yet reviewed.
