id: hr-hops-wind-generation-reports
name: Monthly and annual reports on wind power production in Croatia (Izvještaji o proizvodnji VE u RH)
publisher: Croatian Transmission System Operator (Hrvatski operator prijenosnog sustava, HOPS)
publisher_role: tso
countries: [HR]
level: country
technology: onshore
measure: reported-generation
resolution: monthly
coverage:
  start: 2015
  update: monthly, a few months behind (May 2026 was the latest report on 2026-11-06); annual report for the previous year
capacity: included
coordinates: not-applicable
curtailment: not-reported
conventions:
  timezone: not-applicable
  timestamp: period-label
  unit: MWh
  value: period-total
  evidence: https://www.hops.hr/page-file/zOzMS1Tyv4dK2LQH81KW4L/izvjestaji-o-proizvodnji-ve-u-rh/HOPS%20-%20Mjese%C4%8Dni%20izvje%C5%A1taj%20o%20proizvodnji%20VE%20u%20HR%20za%20Svibanj%202026.pdf
  note: >-
    Each monthly report gives national wind production for the month in MWh (273,690.02 MWh in May
    2026). Hourly output appears only in charts and in the text, also in MWh (maximum hourly output
    1,018.28 MWh on 15.5.2026 at 21 h); the reports do not state a time zone or which end of the
    hour '21 h' refers to. Read 2026-11-06 by an automated research pass; not yet reviewed.
