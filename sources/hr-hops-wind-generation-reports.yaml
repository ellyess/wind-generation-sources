traps:
  - summary: Production is given only as a national total; the per-farm table lists capacity and location but no output.
    detail: >-
      The May 2026 report lists 30 wind farms in regular operation (1,237.15 MW in total), each
      with county and municipality, capacity, connection voltage and year of commissioning, but
      reports production only for Croatia as a whole (273,690.02 MWh in May 2026, a capacity
      factor of 27.99%). Hourly output appears only as charts, with no table behind them. The
      farm list is easy to mistake for per-farm generation data.
    evidence: https://www.hops.hr/page-file/zOzMS1Tyv4dK2LQH81KW4L/izvjestaji-o-proizvodnji-ve-u-rh/HOPS%20-%20Mjese%C4%8Dni%20izvje%C5%A1taj%20o%20proizvodnji%20VE%20u%20HR%20za%20Svibanj%202026.pdf
    found: 2026-11-06
notes: >-
  One PDF per month from January 2016 to May 2026, plus annual reports for 2015 to 2025 (the 2025
  report gives 3,095.97 GWh of wind production). Each report gives national wind production in
  MWh, installed capacity, capacity factor and charts of hourly output, along with a table of the
  farms in operation (name, county and municipality, MW, connection voltage, year). On the
  2026-11-06 check the site refused plain command-line requests, so the reports were read through
  a web browser. (Updated 2026-11-07: on that day the report page and the May 2026 PDF both
  answered HTTP 200 to a plain Python requests call with its default user agent, and the report
  page to curl as well, so command-line access worked then; it may not always.) HOPS also publishes yearly "Temeljni podaci" (basic data) PDFs from 2009 at
  https://www.hops.hr/temeljni-podaci, which summarise the national electricity balance.
  Corrected 2026-11-08: coverage starts in 2015, not 2016. The 2015 annual report on the same page
  gives "Total WPP generation in Croatia in 2015 was 787.93 GWh" in its text; its monthly figures
  are only in a chart, with the range quoted in words (34.87 GWh in July to 89.52 GWh in
  September), so 2015 is annual only and the monthly PDFs start in January 2016.
status: active
reviewed: false
last_checked: 2026-11-08
