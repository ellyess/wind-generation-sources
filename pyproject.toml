[project]
name = "wind-generation-sources"
version = "0.1.0"
description = "An open, licence-annotated catalogue of where to find observed wind power generation, worldwide."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT (code); CC-BY-4.0 (catalogue entries)" }
authors = [{ name = "Ellyess Benmoufok" }]
dependencies = ["pyyaml>=6", "jsonschema>=4.21"]

[project.scripts]
wgs = "wgs.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wgs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
